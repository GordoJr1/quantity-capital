# "Deploy static content to Pages" does not retry a 400 from
# actions/deploy-pages when a previous SHA is still "in progress"
# (insider tape deploy can hold that lock through the politician push).
# Rebuild HEAD, at most twice per SHA (the lock can outlast one retry),
# so daily tape publishes still go live.
name: pages-retry
on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
concurrency:
  group: pages-retry
  cancel-in-progress: false
jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Retry Deploy static content to Pages (max 2 per SHA)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          fails=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=20" \
            --jq '[.workflow_runs[] | select(.name=="Deploy static content to Pages" and .conclusion=="failure")] | length')
          echo "failed Deploy static content to Pages runs for ${SHA:0:7}: $fails"
          if [ "${fails:-0}" -ge 3 ]; then
            echo "already retried this SHA; not looping"
            exit 0
          fi
          echo "waiting for previous Pages deploy lock to drop"
          sleep 90
          if gh workflow run static.yml --ref main -R "$REPO"; then
            echo "dispatched Pages deploy"
            exit 0
          fi
          echo "::warning::could not dispatch Pages deploy"
          gh run rerun "$FAILED_RUN" --failed -R "$REPO"
