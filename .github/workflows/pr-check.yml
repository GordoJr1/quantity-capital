# Cheap static-site check for pull requests. JSON + JS syntax only.
# No province crawls, no qc.sqlite, no publish.
name: pr-check
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate key JSON
        run: |
          set -euo pipefail
          for f in \
            claims/companies.json \
            claims/overview.geojson \
            claims/extract-bytes.json \
            beta/claims-publics.json \
            tickers.json \
            traders.json \
            tells.json \
            backtest.json \
            insider-follow.json \
            insider-companies.json \
            canada/commodities.json \
            canada/producer-join.json \
            scripts/canada-mine-production-sources.json \
            beta/newmont.json \
            beta/artemis-gold.json \
            beta/hudbay-minerals.json
          do
            echo "json $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Syntax-check JS
        run: |
          set -euo pipefail
          for f in claims-map.js claims-neighbors.js qc.js sw.js chart.js refresh.js
          do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Claims insider universe
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/merge_claims_insider_universe.py
          python3 scripts/test_merge_claims_insider_universe.py
          python3 scripts/merge_claims_insider_universe.py --check --no-extracts
          python3 scripts/test_run_pr_merge_gate.py
          # Cloud Agents have no TYPESAFE_API_KEY. QC box runs --require-jev.
          python3 scripts/run_pr_merge_gate.py --packet-only
          test -s scripts/claims-insider-ticker-audit.csv
          test -s scripts/claims-insider-ticker-audit.md
          test -s scripts/claims-insider-jev-packet.json
          grep -q 'qc-pr-merge-gate-v1' scripts/claims-insider-jev-packet.json
          grep -q 'No filings yet' qc.js
          grep -q 'no filings yet' insiders.html
          grep -q 'qc-empty-filings' insiders.html
          grep -q 'qc-empty-filings' insider-ticker.html
          grep -q 'emptyFilingsBadgeHtml' qc.js
          grep -q 'probe-gold' insider-companies.json
          grep -q 'g2-goldfields' insider-companies.json
          echo "claims insider universe ok"

      - name: Confirm claims HUD hooks
        run: |
          set -euo pipefail
          grep -q 'Download data' claims.html
          grep -E -q 'id="download-claims"|id="download-data"' claims.html
          grep -q 'All companies' claims.html
          grep -q 'function showAllClaims' claims-map.js
          grep -q 'claims/overview.geojson' claims-map.js
          grep -q 'function loadOverview' claims-map.js
          grep -q 'function overviewForCompany' claims-map.js
          grep -q 'function nearbyPadsForCompany' claims-map.js
          grep -q 'function fitCompanyTitles' claims-map.js
          grep -q 'function loadNearbyExtracts' claims-map.js
          grep -q 'function canadaCamps' claims-map.js
          grep -q 'function claimKey' claims-map.js
          grep -q '|xy|' claims-map.js
          grep -q 'id="camps"' claims.html
          grep -q 'claims/extract-bytes.json' claims-map.js
          grep -q 'NEARBY_PAD_DEG' claims-map.js
          grep -q 'downloadVisibleClaims' claims-map.js
          grep -q 'Download neighbors' claims.html
          grep -q 'id="download-neighbors"' claims.html
          grep -q 'Select a company first' claims.html
          grep -q 'function downloadNeighbors' claims-map.js
          grep -q 'qc-claims-neighbors-' claims-neighbors.js
          grep -q 'function buildNeighborRows' claims-neighbors.js
          grep -q 'insider-companies.json' claims-map.js
          if grep -n 'loadAllExtracts' claims-map.js; then
            echo "loadAllExtracts must not return (overview-first)" >&2
            exit 1
          fi
          echo "claims HUD hooks ok"

      - name: Neighbor sheet matching
        run: node scripts/check_claims_neighbors.js

      - name: Claims issuer profiles (Work B)
        run: |
          set -euo pipefail
          python3 scripts/build_claims_beta_profiles.py --check
          python3 scripts/test_build_claims_beta_profiles.py
          python3 scripts/run_claims_beta_gate.py --packet-only
          grep -q 'beta/claims-publics.json' beta.html
          grep -q 'claims/overview.geojson' beta.html
          grep -q 'function previewFootprint' beta.html
          grep -q 'function loadClaimsOverview' beta.html
          grep -q 'data-layer="claims"' beta.html
          grep -q 'id="claims-line"' beta.html
          grep -q 'PREVIEW_NEAR_MAX' beta.html
          grep -q 'preview-focus-dot' beta.html
          if grep -n 'loadAllExtracts' beta.html; then
            echo "beta.html must not call loadAllExtracts" >&2
            exit 1
          fi
          if grep -nE 'claims/[a-z0-9-]+(-ontario|-bc)?\.geojson' beta.html | grep -v 'claims/overview.geojson'; then
            echo "beta.html must not fetch per-company extracts" >&2
            exit 1
          fi
          echo "claims issuer profiles ok"

      - name: Canada commodities (Work C)
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_canada_commodities.py
          python3 -m py_compile scripts/ingest_canada_mine_production.py scripts/canada_beta_production.py scripts/qc_sqlite/canada_mines.py
          python3 scripts/test_canada_commodities.py
          python3 scripts/test_canada_mine_production.py
          python3 scripts/test_run_canada_commodities_gate.py
          python3 scripts/run_canada_commodities_gate.py --packet-only
          python3 scripts/build_canada_commodities.py --check
          python3 scripts/ingest_canada_mine_production.py --check
          test -s scripts/canada-commodities-jev-packet.json
          grep -q 'qc-pr-merge-gate-v1' scripts/canada-commodities-jev-packet.json
          grep -q 'never_invent' scripts/canada-commodities-jev-packet.json
          grep -q 'company_filing_cited' scripts/canada-commodities-jev-packet.json
          grep -q 'canada.html' beta.html
          grep -q 'canada.html' claims.html
          grep -q './canada.html' sw.js
          grep -q 'canada.html' qc.js
          grep -q 'qc-canada-commodities-v1' canada/commodities.json
          grep -q 'qc-canada-producer-join-v1' canada/producer-join.json
          grep -q 'built_from' canada/producer-join.json
          grep -q 'qc.sqlite' canada/producer-join.json
          grep -q 'beta/newmont.json' canada/producer-join.json
          grep -q '"brucejack"' beta/newmont.json
          grep -q 'producer-join.json' canada.html
          grep -q 'figureFromJoin' canada.html
          grep -q 'qc.sqlite' canada.html
          grep -q '2025 prod' canada.html
          grep -q 'From company filings where disclosed' canada.html
          grep -q 'CREATE TABLE IF NOT EXISTS canada_mines' scripts/qc_sqlite/schema.sql
          grep -q 'CREATE TABLE IF NOT EXISTS canada_mine_production' scripts/qc_sqlite/schema.sql
          grep -q 'qc.sqlite' .gitignore
          test ! -e canada/mine-production.json
          test ! -e beta/gold-mountain-mining.json
          test ! -e beta/imperial-metals.json
          grep -q 'claims.html?company=' canada/commodities.json
          grep -q 'function showAllClaims' claims-map.js
          if grep -n 'loadAllExtracts' claims-map.js canada.html; then
            echo "canada tab must not regress claims load-all" >&2
            exit 1
          fi
          echo "canada commodities ok"
