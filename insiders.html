  <script>
    const WINDOWS = [14, 30, 90, 540];
    const CHART_RANGES = ["1m", "3m", "6m", "1y", "3y"];
    const PAGE = 120;
    const DESK_MQ = window.matchMedia("(min-width: 900px)");
    const params = new URLSearchParams(location.search);
    let days = WINDOWS.indexOf(Number(params.get("w"))) >= 0 ? Number(params.get("w")) : 90;
    let side = params.get("side") || "";
    let view = params.get("view") === "issuers" ? "issuers" : "tape";
    if (location.hash === "#basket") view = "basket";
    let emptyOnly = params.get("empty") === "1";
    let q = params.get("q") || "";
    let showAll = false;
    let all = [];
    let companies = [];
    let filingTickers = {};
    let collected = "";
    let deskRows = [];
    let activeId = "";
    let userPicked = false;
    let chartRange = "3m";
    let chartToken = 0;
    let followIds = {};
    const priceCache = {};

    function labelW(d) {
      if (d <= 14) return "14 days";
      if (d <= 30) return "30 days";
      if (d <= 90) return "90 days";
      return "18 months";
    }
    function newestFirst(a, b) {
      const traded = String(b.trade_date || "").localeCompare(String(a.trade_date || ""));
      if (traded) return traded;
      const filed = String(b.filed_date || "").localeCompare(String(a.filed_date || ""));
      if (filed) return filed;
      const added = String(b.added || "").localeCompare(String(a.added || ""));
      if (added) return added;
      return String(b.id || "").localeCompare(String(a.id || ""));
    }
    function activeTrade() {
      return deskRows.find((t) => t.id === activeId) || deskRows[0] || null;
    }
    function firstVisibleId() {
      return deskRows[0] ? deskRows[0].id : "";
    }
    function syncDeskSelection(keepPick) {
      const still = keepPick && userPicked && deskRows.some((t) => t.id === activeId);
      if (still) return;
      userPicked = false;
      const next = firstVisibleId();
      if (activeId !== next) chartRange = "3m";
      activeId = next;
    }
    function esc(s) { return QC.esc(s); }

    function garbageCompany(s) {
      const t = String(s || "");
      if (!t) return false;
      if (/[\uFFFD]|Ã.|Â.|â€.|ï¿½|ðŸ/.test(t)) return true;
      let weird = 0;
      let letters = 0;
      for (let i = 0; i < t.length; i++) {
        const c = t.charCodeAt(i);
        if ((c >= 65 && c <= 90) || (c >= 97 && c <= 122)) letters++;
        else if (c < 32 || c === 127 || c > 255) weird++;
        else if (c > 127 && c < 160) weird++;
      }
      if (t.length >= 4 && letters === 0) return true;
      if (t.length >= 8 && weird / t.length > 0.18) return true;
      if (!/\s/.test(t) && t.length > 18 && (t.match(/[a-z][A-Z]/g) || []).length > 4) return true;
      return false;
    }

    function displayCompany(name, ticker) {
      const s = String(name || "").replace(/\s+/g, " ").trim();
      const tk = String(ticker || "").trim();
      if (!s || s === "—") return "";
      if (garbageCompany(s)) return tk && tk !== "—" ? tk : "";
      return s;
    }

    let qSyncTimer = 0;
    function syncUrl() {
      clearTimeout(qSyncTimer);
      qSyncTimer = 0;
      const p = new URLSearchParams();
      if (view === "issuers") p.set("view", "issuers");
      else {
        p.set("w", String(days));
        if (side) p.set("side", side);
      }
      if (emptyOnly) p.set("empty", "1");
      if (q && String(q).trim()) p.set("q", String(q).trim());
      const qs = p.toString();
      const hash = view === "basket" ? "#basket" : "";
      history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + hash);
    }
    function syncUrlSoon() {
      clearTimeout(qSyncTimer);
      qSyncTimer = setTimeout(syncUrl, 200);
    }

    function issuerBlob(co) {
      return [co.name, co.claims_id, QC.companySymbols(co).join(" ")].join(" ").toLowerCase();
    }

    function matchingIssuers(needle) {
      const n = String(needle || "").trim().toLowerCase();
      return (companies || []).filter((co) => {
        const filings = QC.issuerFilingCount(co, filingTickers);
        if (emptyOnly && filings) return false;
        if (n && issuerBlob(co).indexOf(n) < 0) return false;
        return true;
      });
    }

    function paintWindows() {
      const views =
        "<button type=\"button\" class=\"chip" + (view === "tape" ? " on" : "") + "\" data-view=\"tape\">Tape</button>" +
        "<button type=\"button\" class=\"chip" + (view === "issuers" ? " on" : "") + "\" data-view=\"issuers\">Issuers</button>" +
        "<button type=\"button\" class=\"chip" + (view === "basket" ? " on" : "") + "\" data-view=\"basket\">Basket</button>";
      const extra = view === "basket"
        ? ""
        : view === "issuers"
        ? "<button type=\"button\" class=\"chip" + (emptyOnly ? " on" : "") + "\" data-empty=\"1\">No filings</button>"
        : WINDOWS.map((d) => "<button type=\"button\" class=\"chip" + (d === days ? " on" : "") + "\" data-w=\"" + d + "\">" + labelW(d) + "</button>").join("") +
          "<button type=\"button\" class=\"chip" + (side === "purchase" ? " on" : "") + "\" data-side=\"purchase\">Buys</button>" +
          "<button type=\"button\" class=\"chip" + (side === "sale" ? " on" : "") + "\" data-side=\"sale\">Sells</button>";
      document.getElementById("windows").innerHTML = views + extra;
      const qEl = document.getElementById("q");
      if (qEl) qEl.placeholder = view === "issuers" ? "Search ticker or company" : "Search officer, ticker, or company";
      const desk = document.getElementById("desk");
      if (desk) desk.classList.toggle("issuers-only", view === "issuers");
    }

    function paintIssuerList(list) {
      const cols = "<li class=\"qc-issuer-cols\" aria-hidden=\"true\"><span>Ticker / company</span><span>Filings</span></li>";
      const body = list.map((co) => QC.issuerRowHtml(co, { filings: QC.issuerFilingCount(co, filingTickers) })).join("");
      document.getElementById("rows").innerHTML = list.length
        ? cols + body
        : "<li class=\"muted\">No issuers match.</li>";
    }

    function showBasket(on) {
      const section = document.getElementById("basket");
      const desk = document.getElementById("desk");
      const picker = document.querySelector(".picker");
      const count = document.getElementById("tape-count");
      const moreRow = document.getElementById("more-row");
      if (section) section.hidden = !on;
      if (desk) desk.hidden = !!on;
      if (picker) picker.hidden = !!on;
      if (on) {
        if (count) count.hidden = true;
        if (moreRow) moreRow.hidden = true;
        if (window.QCTrack) QCTrack.mountBasket(document.getElementById("basket-body"));
      }
    }

    function loadFocusPast(fid) {
      const fold = document.getElementById("focus-past");
      const body = document.getElementById("focus-past-body");
      if (!fold || !body || !fid || !window.QCTrack) return;
      if (body.getAttribute("data-fid") === fid && body.childElementCount) return;
      body.setAttribute("data-fid", fid);
      QCTrack.mountPerson(body, fid, {
        heading: false,
        onEmpty: function () {
          fold.hidden = true;
          fold.open = false;
          fold.setAttribute("data-empty", "1");
        }
      });
    }

    let pastToken = 0;
    let pastWant = false;
    function syncFocusPast(t) {
      const fold = document.getElementById("focus-past");
      const body = document.getElementById("focus-past-body");
      if (!fold || !body) return;
      const fid = t && t.filer_id ? String(t.filer_id) : "";
      const desk = DESK_MQ.matches;
      if (!fid || !desk || !window.QCTrack) {
        fold.hidden = true;
        return;
      }
      if (fold.getAttribute("data-fid") !== fid) {
        fold.setAttribute("data-fid", fid);
        fold.removeAttribute("data-empty");
        fold.removeAttribute("data-ready");
        body.removeAttribute("data-fid");
        body.innerHTML = "";
        fold.open = false;
      }
      if (fold.getAttribute("data-empty") === "1") {
        fold.hidden = true;
        return;
      }
      if (fold.getAttribute("data-ready") === "1") {
        fold.hidden = false;
        if (fold.open) loadFocusPast(fid);
        return;
      }
      fold.hidden = true;
      if (!pastWant && !userPicked) return;
      const token = ++pastToken;
      QCTrack.filerHasFile(fid).then((yes) => {
        if (token !== pastToken || fold.getAttribute("data-fid") !== fid) return;
        if (yes) {
          fold.setAttribute("data-ready", "1");
          fold.hidden = false;
        } else {
          fold.setAttribute("data-empty", "1");
          fold.hidden = true;
          fold.open = false;
        }
      });
    }

    function paint(rows, collectedAt, keepPick) {
      document.getElementById("asof").textContent = QC.asOfLabel(collectedAt);
      paintWindows();
      if (view === "basket") {
        showBasket(true);
        return;
      }
      showBasket(false);
      if (view === "issuers") {
        const list = matchingIssuers(q).slice().sort((a, b) => String(a.name || "").localeCompare(String(b.name || "")));
        const count = document.getElementById("tape-count");
        const moreRow = document.getElementById("more-row");
        if (count) {
          count.hidden = false;
          const emptyN = list.filter((co) => !QC.issuerFilingCount(co, filingTickers)).length;
          count.textContent = list.length
            ? list.length + " issuers" + (emptyN ? " · " + emptyN + " no filings yet" : "")
            : "";
        }
        if (moreRow) moreRow.hidden = true;
        const focusEl = document.getElementById("focus");
        if (focusEl) focusEl.hidden = true;
        paintIssuerList(list);
        return;
      }
      const cut = new Date(); cut.setDate(cut.getDate() - days);
      const cutIso = cut.toISOString().slice(0, 10);
      const needle = q.trim().toLowerCase();
      const vis = rows.filter((t) => {
        const day = t.filed_date || t.trade_date || "";
        if (day && day < cutIso) return false;
        if (side === "purchase" && !QC.isMarketBuy(t)) return false;
        if (side === "sale" && !QC.isMarketSale(t)) return false;
        if (needle) {
          const blob = [t.filer, t.title, t.ticker, t.company].join(" ").toLowerCase();
          if (!blob.includes(needle)) return false;
        }
        return true;
      }).sort(newestFirst);
      const mobile = !DESK_MQ.matches;
      if (!mobile) deskRows = vis.slice(0, 400);
      else deskRows = showAll ? vis : vis.slice(0, PAGE);
      const count = document.getElementById("tape-count");
      const moreRow = document.getElementById("more-row");
      const moreBtn = document.getElementById("show-all");
      if (count) {
        count.hidden = true;
        count.textContent = "";
      }
      if (moreRow && moreBtn) {
        moreRow.hidden = !mobile || (vis.length <= PAGE && !showAll);
        moreBtn.textContent = showAll ? "Show first 120" : "Show full list";
      }
      syncDeskSelection(keepPick);
      const slim = DESK_MQ.matches;
      const nameHrefOf = (t) => t.filer_id ? "insider.html?id=" + encodeURIComponent(t.filer_id) : "";
      const rowOf = (t) => {
        const co = displayCompany(t.company, t.ticker);
        const tk = String(t.ticker || "").toUpperCase();
        const coShow = co && co.toUpperCase() !== tk ? co : "";
        return QC.tradeRowHtml(Object.assign({}, t, { company: coShow }), {
          variant: "tape",
          follow: !!(t.filer_id && followIds[t.filer_id]),
          nameHref: nameHrefOf(t)
        });
      };
      const groups = [];
      deskRows.forEach((t) => {
        const key = t.filed_date || t.trade_date || "";
        const last = groups[groups.length - 1];
        if (last && last.key === key) last.rows.push(t);
        else groups.push({ key: key, rows: [t] });
      });
      const bodyHtml = groups.map((g) => {
        const fresh = (g.rows || []).some((t) => QC.isLanded(t, 72));
        const heading = DESK_MQ.matches
          ? (fresh ? ("Just filed " + QC.filedHeading(g.key).replace(/^Filed\s+/, "")) : QC.filedHeading(g.key))
          : QC.tapeSectionHeading(g.key, fresh);
        const cls = fresh ? " class=\"day fresh\"" : " class=\"day\"";
        return "<li" + cls + "><h2>" + QC.esc(heading) + "</h2></li>" +
          g.rows.map(rowOf).join("");
      }).join("");
      const colsHtml = QC.tapePhoneColsHtml() + "<li class=\"qc-txn-cols\" aria-hidden=\"true\">" +
        "<span class=\"qc-txn-date\">Date</span>" +
        "<span class=\"qc-txn-id\">Name</span>" +
        "<span class=\"qc-txn-company\">Ticker</span>" +
        "<span class=\"qc-txn-coname\">Company</span>" +
        "<span class=\"qc-txn-chip\">Trade</span>" +
        "<span class=\"qc-txn-hero\">Value</span>" +
      "</li>";
      if (deskRows.length) {
        document.getElementById("rows").innerHTML = colsHtml + bodyHtml;
      } else {
        const issuerHits = needle ? matchingIssuers(needle) : [];
        if (issuerHits.length) {
          document.getElementById("rows").innerHTML =
            "<li class=\"muted\">No insider prints in this window.</li>" +
            issuerHits.map((co) => QC.issuerRowHtml(co, { filings: QC.issuerFilingCount(co, filingTickers) })).join("");
        } else {
          document.getElementById("rows").innerHTML = "<li class=\"muted\">No insider prints in this window.</li>";
        }
      }
      if (window.QC && QC.restoreScroll) QC.restoreScroll();
      markActiveRow();
      paintFocus();
      const focusEl = document.getElementById("focus");
      if (focusEl) focusEl.hidden = false;
      paintChart();
      if (window.QCTrack) QCTrack.stampTape(deskRows, document.getElementById("rows"));
    }

    function markActiveRow() {
      document.querySelectorAll("#rows .qc-txn-tape").forEach((el) => {
        el.classList.toggle("on", el.getAttribute("data-id") === activeId);
      });
    }

    function paintFocus() {
      const head = document.getElementById("focus-head");
      const foot = document.getElementById("focus-foot");
      if (!head || !foot) return;
      const t = activeTrade();
      if (!t) {
        head.innerHTML = "<p class=\"quiet\">Select a print on the tape.</p>";
        foot.innerHTML = "";
        syncFocusPast(null);
        return;
      }
      const role = QC.shortRole(t);
      const fresh = QC.isLanded(t, 72);
      const owner = String(t.owner || "").toLowerCase();
      const code = String(t.ticker || "").toUpperCase();
      const chartable = QC.isChartTicker(code);
      const tickerHtml = chartable
        ? "<a href=\"insider-ticker.html?t=" + encodeURIComponent(code) + "\">" + esc(code) + "</a>"
        : esc(code);
      const name = QC.titleCaseName(t.filer);
      const who = t.filer_id
        ? "<a class=\"who\" href=\"insider.html?id=" + encodeURIComponent(t.filer_id) + "\" title=\"" + esc(name) + "\">" + esc(name) + "</a>"
        : "<span class=\"who\" title=\"" + esc(name) + "\">" + esc(name) + "</span>";
      const co = displayCompany(t.company, code);
      const coShow = co && co.toUpperCase() !== code ? co : "";
      const assetTitle = [code, coShow].filter(Boolean).join(" ");
      const sh = QC.formatSharesQuiet(t.shares);
      const px = QC.formatPriceQuiet(t.price);
      const held = QC.formatHeldQuiet(t.held_pct);
      const delta = QC.positionDelta(t);
      const statBits = [];
      if (sh) statBits.push("<span class=\"focus-stat\"><span class=\"focus-stat-k\">Shares</span> <span class=\"focus-stat-v\">" + esc(sh) + "</span></span>");
      if (px) statBits.push("<span class=\"focus-stat\"><span class=\"focus-stat-k\">Price</span> <span class=\"focus-stat-v\">" + esc(px) + "</span></span>");
      if (held) {
        const dcls = (delta === "up" || delta === "down") ? " " + delta : "";
        statBits.push("<span class=\"focus-stat" + dcls + "\"><span class=\"focus-stat-k\">% Held</span> <span class=\"focus-stat-v\">" + esc(held) + "</span></span>");
      }
      const statsHtml = statBits.length ? "<div class=\"focus-stats\">" + statBits.join("") + "</div>" : "";
      head.innerHTML =
        who +
        "<div class=\"chips\">" +
          (role ? "<span class=\"ch\">" + esc(role) + "</span>" : "") +
          (t.filer_id && followIds[t.filer_id] ? "<span class=\"ch hot\">Follow</span>" : "") +
          (t.plan ? "<span class=\"ch\">Plan</span>" : "") +
          (owner === "indirect" ? "<span class=\"ch\">Indirect</span>" : "") +
          (fresh ? "<span class=\"ch hot\">Just filed</span>" : "") +
        "</div>" +
        statsHtml +
        "<p class=\"asset\" title=\"" + esc(assetTitle) + "\">" + tickerHtml +
          (coShow ? " " + esc(coShow) : "") + "</p>" +
        "<p class=\"quiet\">" + esc(t.commodity || t.title || "") + "</p>";
      const tickerBtn = chartable
        ? "<a class=\"btn\" href=\"insider-ticker.html?t=" + encodeURIComponent(code) + "\">Open ticker</a>"
        : "";
      const insiderBtn = t.filer_id
        ? "<a class=\"btn fill\" href=\"insider.html?id=" + encodeURIComponent(t.filer_id) + "\">Open insider</a>"
        : "";
      foot.innerHTML = "<div class=\"cta\">" + insiderBtn + tickerBtn + "</div>";
      syncFocusPast(t);
    }

    function loadPrices(ticker) {
      const code = String(ticker || "").toUpperCase();
      if (!code || !QC.isChartTicker(code)) return Promise.resolve(null);
      if (!priceCache[code]) {
        priceCache[code] = fetch("prices/" + encodeURIComponent(code) + ".json")
          .then((r) => r.ok ? r.json() : null)
          .then((d) => (d && d.c && d.c.length >= 2) ? d.c : null)
          .catch(() => null);
      }
      return priceCache[code];
    }

    function paintRange() {
      const box = document.getElementById("range");
      if (!box) return;
      box.innerHTML = CHART_RANGES.map((r) =>
        "<button type=\"button\" class=\"" + (r === chartRange ? "on" : "") + "\" data-r=\"" + r + "\">" +
          r.toUpperCase() + "</button>"
      ).join("");
    }

    function pickRangeForTrade(points, tradeIso, preferred) {
      const order = preferred === "1m"
        ? ["1m", "3m", "6m", "1y", "3y"]
        : ["3m", "6m", "1y", "3y", "1m"];
      const start = Math.max(0, order.indexOf(preferred));
      for (let i = start; i < order.length; i++) {
        const slice = slicePriceRange(points, order[i]);
        if (slice.length >= 2 && tradeIso >= slice[0][0] && tradeIso <= slice[slice.length - 1][0]) {
          return order[i];
        }
      }
      return preferred;
    }

    function hidePop() {
      const pop = document.getElementById("mark-pop");
      if (pop) pop.hidden = true;
    }

    function sideBadge(side) {
      if (side === "sale" || side === "sale_post") return { cls: "sell", label: "SELL" };
      if (side === "purchase") return { cls: "buy", label: "BUY" };
      const label = QC.txnChipLabel({ side: side }) || String(side || "TXN");
      return { cls: "buy", label: label.toUpperCase() };
    }

    function showPop(rec) {
      const pop = document.getElementById("mark-pop");
      const wrap = document.getElementById("chart-wrap");
      if (!pop || !wrap || !rec) return;
      if (typeof hideChartHoverUi === "function") {
        hideChartHoverUi(wrap, document.getElementById("chart-svg"));
      }
      const marks = (rec.marks && rec.marks.length) ? rec.marks : [rec.mark || {}];
      const m = marks[0] || {};
      const badge = sideBadge(rec.side || m.side);
      const val = Number(m.value);
      const amt = (isFinite(val) && val > 0)
        ? "$" + Math.round(val).toLocaleString("en-US")
        : (m.amount ? QC.formatAmountRange(m.amount) : "");
      const sh = m.shares ? QC.formatSharesQuiet(m.shares) : "";
      const px = (m.price != null && isFinite(Number(m.price))) ? QC.formatQuote(m.price) : "";
      const mDate = m.date ? QC.prettyDate(m.date) : "";
      const bits = [];
      if (amt) bits.push("<span class=\"pop-single-amt\">" + esc(amt) + "</span>");
      if (sh) bits.push("<span class=\"pop-single-amt\">" + esc(sh) + " sh</span>");
      if (px) bits.push("<span class=\"pop-single-date\">" + esc(px) + "</span>");
      if (mDate) bits.push("<span class=\"pop-single-date\">" + esc(mDate) + "</span>");
      pop.innerHTML =
        "<div class=\"pop-header\">" +
          "<div class=\"pop-title-wrap\">" +
            "<span class=\"pop-badge " + badge.cls + "\">" + esc(badge.label) + "</span>" +
            "<div class=\"pop-title\" title=\"" + esc(m.filer || "") + "\">" + esc(m.filer || "") + "</div>" +
          "</div>" +
          "<button type=\"button\" class=\"pop-close\" aria-label=\"Close popover\">✕</button>" +
        "</div>" +
        "<div class=\"pop-single-detail\">" +
          bits.join("<span class=\"pop-dot\">·</span>") +
        "</div>";
      const closeBtn = pop.querySelector(".pop-close");
      if (closeBtn) {
        const closeFn = (e) => {
          e.stopPropagation();
          e.preventDefault();
          hidePop();
        };
        closeBtn.addEventListener("click", closeFn);
        closeBtn.addEventListener("touchend", closeFn);
      }
      const svg = document.getElementById("chart-svg");
      const popWidth = Math.min(220, Math.max(160, wrap.getBoundingClientRect().width - 20));
      if (typeof placeMarkPop === "function") {
        placeMarkPop(pop, wrap, svg, rec, { width: popWidth });
      } else {
        const wr = wrap.getBoundingClientRect();
        const sr = svg.getBoundingClientRect();
        pop.style.width = popWidth + "px";
        pop.style.right = "auto";
        pop.style.transform = "none";
        const pinScreenX = (sr.left - wr.left) + rec.xPct * sr.width;
        const pinScreenY = (sr.top - wr.top) + rec.yPct * sr.height;
        let popLeft = pinScreenX - (popWidth / 2);
        popLeft = Math.max(8, Math.min(wr.width - popWidth - 8, popLeft));
        pop.style.left = popLeft + "px";
        if (pinScreenY < 120 || rec.yPct < 0.46) {
          pop.style.top = (pinScreenY + 16) + "px";
          pop.style.bottom = "auto";
        } else {
          pop.style.top = (pinScreenY - 16) + "px";
          pop.style.bottom = "auto";
          pop.style.transform = "translateY(-100%)";
        }
      }
      pop.hidden = false;
    }

    function clearChart(note) {
      const svg = document.getElementById("chart-svg");
      const xBox = document.getElementById("chart-x");
      const yBox = document.getElementById("chart-y");
      const wrap = document.getElementById("chart-wrap");
      if (svg) svg.innerHTML = "";
      if (xBox) xBox.innerHTML = "";
      if (yBox) yBox.innerHTML = "";
      hidePop();
      if (!wrap) return;
      let el = wrap.querySelector(".chart-note");
      if (!note) {
        if (el) el.remove();
        return;
      }
      if (!el) {
        el = document.createElement("p");
        el.className = "chart-note";
        wrap.appendChild(el);
      }
      el.textContent = note;
    }

    // Phone chart strip (<900px): closed by default; a tap opens the full chart in place and a second tap closes it.
    let stripOpen = false;
    function setStripOpen(open) {
      stripOpen = !!open;
      const card = document.getElementById("focus");
      const btn = document.getElementById("strip-toggle");
      if (card) card.classList.toggle("open", stripOpen);
      if (btn) {
        btn.setAttribute("aria-expanded", stripOpen ? "true" : "false");
        btn.textContent = stripOpen ? "Close" : "Chart";
      }
      paintChart();
    }
    function bindStrip() {
      const card = document.getElementById("focus");
      if (!card || card.dataset.strip) return;
      card.dataset.strip = "1";
      card.addEventListener("click", (e) => {
        if (DESK_MQ.matches) return;
        if (e.target.closest("#strip-toggle")) { setStripOpen(!stripOpen); return; }
        if (!stripOpen) {
          // Closed strip: any tap opens it (links included), so the first tap never leaves the page.
          e.preventDefault();
          setStripOpen(true);
          return;
        }
        if (e.target.closest("a, button, summary, #focus-chart, .mark-pop")) return;
        setStripOpen(false);
      });
    }
    // Small sparkline for the closed phone strip: the same price slice as the full chart, plus the trade-date dot.
    function paintSpark(slice, note, tradeIso, side) { // side: "buy" | "sell" | ""
      const box = document.getElementById("spark");
      if (!box || DESK_MQ.matches) return;
      if (!slice || slice.length < 2) {
        box.innerHTML = "<span class=\"spark-note\">" + esc(note || "No chart for this print.") + "</span>";
        return;
      }
      const w = Math.max(100, Math.round(box.clientWidth || 320));
      const h = Math.max(30, Math.round(box.clientHeight || 52));
      const p = 5;
      const ys = slice.map((q) => Number(q[1]));
      const lo = Math.min.apply(null, ys);
      const hi = Math.max.apply(null, ys);
      const span = hi - lo || 1;
      const X = (i) => p + (i * (w - 2 * p)) / (slice.length - 1);
      const Y = (v) => p + (1 - (v - lo) / span) * (h - 2 * p);
      const line = slice.map((q, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(Number(q[1])).toFixed(1)).join(" ");
      const area = line + " L" + X(slice.length - 1).toFixed(1) + " " + h + " L" + X(0).toFixed(1) + " " + h + " Z";
      let dot = "";
      if (tradeIso && tradeIso >= String(slice[0][0])) {
        let k = slice.findIndex((q) => String(q[0]) >= tradeIso);
        if (k < 0) k = slice.length - 1;
        dot = "<circle class=\"spark-dot " + (side || "") + "\" cx=\"" + X(k).toFixed(1) + "\" cy=\"" + Y(ys[k]).toFixed(1) + "\" r=\"5\"></circle>";
      }
      const end = "<circle class=\"spark-end\" cx=\"" + X(slice.length - 1).toFixed(1) + "\" cy=\"" + Y(ys[ys.length - 1]).toFixed(1) + "\" r=\"3\"></circle>";
      box.innerHTML = "<svg viewBox=\"0 0 " + w + " " + h + "\" width=\"" + w + "\" height=\"" + h + "\" focusable=\"false\">" +
        "<path class=\"spark-area\" d=\"" + area + "\"></path><path class=\"spark-line\" d=\"" + line + "\"></path>" + dot + end + "</svg>";
    }

    function paintChart() {
      const t = activeTrade();
      const token = ++chartToken;
      hidePop();
      paintRange();
      if (!t) {
        clearChart("Select a print on the tape.");
        paintSpark(null, "Select a print on the tape.");
        return;
      }
      const code = String(t.ticker || "").toUpperCase();
      if (!QC.isChartTicker(code) || typeof drawChart !== "function" || typeof slicePriceRange !== "function") {
        const note = code && code !== "—" ? "No daily prices on file for " + code + "." : "This print has no charted ticker.";
        clearChart(note);
        paintSpark(null, note);
        return;
      }
      clearChart("Loading chart…");
      paintSpark(null, "Loading chart…");
      loadPrices(code).then((points) => {
        if (token !== chartToken) return;
        if (!points || points.length < 2) {
          clearChart("No daily prices on file for " + code + ".");
          paintSpark(null, "No daily prices on file for " + code + ".");
          return;
        }
        clearChart("");
        const tradeIso = t.trade_date || "";
        const useRange = pickRangeForTrade(points, tradeIso, chartRange);
        if (useRange !== chartRange) {
          chartRange = useRange;
          paintRange();
        }
        const slice = slicePriceRange(points, chartRange);
        paintSpark(slice, "", tradeIso, sideBadge(t.side).label === "SELL" ? "sell" : t.side === "purchase" ? "buy" : "");
        // Phone strip closed: the sparkline is all that shows; the full chart draws when the strip opens.
        if (!DESK_MQ.matches && !stripOpen) return;
        const marks = [{
          date: tradeIso,
          side: t.side,
          filer: QC.titleCaseName(t.filer),
          amount: t.amount,
          shares: t.shares,
          price: t.price,
          value: t.value
        }];
        // Phones: short chart above the list; the trade card opens on tap instead of covering the line.
        const roomy = DESK_MQ.matches;
        if (roomy) {
          // Back from the phone strip's 170px chart: let the desktop CSS height apply again.
          const svgEl = document.getElementById("chart-svg");
          if (svgEl) svgEl.style.height = "";
        }
        const hits = drawChart(slice, marks, roomy ? {
          range: chartRange,
          theme: "cyan",
          onMark: showPop
        } : {
          range: chartRange,
          theme: "cyan",
          height: 170,
          pad: { t: 16, l: 34, r: 22 },
          onMark: showPop
        });
        requestAnimationFrame(() => {
          if (token !== chartToken || !roomy) return;
          const hit = (hits || []).find((h) => h.date === tradeIso) || (hits && hits[0]);
          if (hit) showPop(hit);
        });
      });
    }

    function selectDesk(id) {
      if (!id) return;
      const next = deskRows.find((t) => t.id === id);
      if (!next) return;
      const prev = activeTrade();
      const tickerChanged = prev && prev.ticker !== next.ticker;
      userPicked = true;
      activeId = id;
      if (tickerChanged) chartRange = "3m";
      markActiveRow();
      paintFocus();
      paintChart();
    }

    function bindDesk() {
      bindStrip();
      const list = document.getElementById("rows");
      const rangeBox = document.getElementById("range");
      if (list && !list.dataset.bound) {
        list.dataset.bound = "1";
        list.addEventListener("click", (e) => {
          if (e.target.closest("a, button")) return;
          const row = e.target.closest("li.qc-txn-tape[data-id]");
          if (row) selectDesk(row.getAttribute("data-id"));
        });
      }
      if (rangeBox && !rangeBox.dataset.bound) {
        rangeBox.dataset.bound = "1";
        rangeBox.addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-r]");
          if (!btn) return;
          chartRange = btn.getAttribute("data-r");
          paintChart();
        });
      }
      if (!bindDesk._resize) {
        bindDesk._resize = true;
        DESK_MQ.addEventListener("change", () => {
          paint(all, collected, true);
        });
        window.addEventListener("resize", () => {
          if (!activeTrade()) return;
          clearTimeout(bindDesk._fit);
          bindDesk._fit = setTimeout(paintChart, 100);
        });
      }
    }

    async function run() {
      bindDesk();
      const data = await fetch("insider-trades-lite.json").then((r) => r.json());
      all = data.trades || [];
      collected = data.collected || "";
      filingTickers = QC.tradeTickerSet(all);
      try {
        const book = await fetch("insider-companies.json").then((r) => r.json());
        companies = book.companies || [];
      } catch (err) {
        companies = [];
      }
      try {
        const follow = await QC.loadFollow();
        followIds = QC.followById(follow);
        QC.mountFollowAlerts(document.getElementById("follow-alerts"), follow);
      } catch (err) {
        followIds = {};
      }
      try {
        const form4 = await QC.loadForm4();
        if (form4) QC.applyForm4(all, form4);
      } catch (err) {}
      paint(all, collected);
    }
    document.getElementById("windows").addEventListener("click", (e) => {
      const v = e.target.closest("button[data-view]");
      const emptyBtn = e.target.closest("button[data-empty]");
      const w = e.target.closest("button[data-w]");
      const s = e.target.closest("button[data-side]");
      if (v) {
        const name = v.dataset.view;
        view = name === "issuers" ? "issuers" : (name === "basket" ? "basket" : "tape");
      }
      if (emptyBtn) emptyOnly = !emptyOnly;
      if (w) days = Number(w.dataset.w);
      if (s) side = side === s.dataset.side ? "" : s.dataset.side;
      if (!v && !emptyBtn && !w && !s) return;
      syncUrl();
      showAll = false;
      paint(all, collected);
    });
    const qInput = document.getElementById("q");
    if (qInput && q) qInput.value = q;
    function onSearchInput(e) {
      q = e.target.value;
      showAll = false;
      paint(all, collected);
      syncUrlSoon();
    }
    if (qInput) {
      qInput.addEventListener("input", onSearchInput);
      qInput.addEventListener("search", onSearchInput);
    }
    function searchNeedsFlush() {
      if (qSyncTimer) return true;
      const current = new URLSearchParams(location.search).get("q") || "";
      return current !== String(q || "").trim();
    }
    document.addEventListener("click", (e) => {
      const a = e.target && e.target.closest && e.target.closest("a[href]");
      if (!a || !searchNeedsFlush()) return;
      let u;
      try { u = new URL(a.getAttribute("href"), location.href); } catch (err) { return; }
      if (u.origin === location.origin && u.pathname === location.pathname && u.search === location.search) return;
      syncUrl();
    }, true);
    window.addEventListener("pagehide", () => { if (searchNeedsFlush()) syncUrl(); });
    document.getElementById("show-all").addEventListener("click", () => {
      showAll = !showAll;
      paint(all, collected);
    });
    run().catch(() => {
      document.getElementById("rows").innerHTML = "<li class=\"muted\">Could not load insider tape.</li>";
    });
    window.addEventListener("pageshow", (e) => {
      if (!e.persisted || !all.length) return;
      userPicked = false;
      paint(all, collected);
    });
    const focusPast = document.getElementById("focus-past");
    const focusEl = document.getElementById("focus");
    if (focusEl) {
      focusEl.addEventListener("pointerenter", () => {
        if (pastWant) return;
        pastWant = true;
        syncFocusPast(activeTrade());
      });
    }
    if (focusPast) {
      focusPast.addEventListener("toggle", () => {
        if (!focusPast.open) return;
        loadFocusPast(focusPast.getAttribute("data-fid") || "");
      });
    }
    window.addEventListener("hashchange", () => {
      const next = location.hash === "#basket" ? "basket" : (view === "basket" ? "tape" : view);
      if (next === view) return;
      view = next;
      showAll = false;
      paint(all, collected);
    });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
  </script>
