# Cheap static-site check for pull requests. JSON + JS syntax only.
# No province crawls, no qc.sqlite, no publish.
name: pr-check
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate key JSON
        run: |
          set -euo pipefail
          for f in \
            claims/companies.json \
            claims/overview.geojson \
            claims/extract-bytes.json \
            tickers.json \
            traders.json \
            tells.json \
            backtest.json \
            insider-follow.json
          do
            echo "json $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Syntax-check JS
        run: |
          set -euo pipefail
          for f in claims-map.js claims-neighbors.js qc.js sw.js chart.js refresh.js
          do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Confirm claims HUD hooks
        run: |
          set -euo pipefail
          grep -q 'Download data' claims.html
          grep -E -q 'id="download-claims"|id="download-data"' claims.html
          grep -q 'All companies' claims.html
          grep -q 'function showAllClaims' claims-map.js
          grep -q 'claims/overview.geojson' claims-map.js
          grep -q 'function loadOverview' claims-map.js
          grep -q 'function overviewForCompany' claims-map.js
          grep -q 'function nearbyPadsForCompany' claims-map.js
          grep -q 'function fitCompanyTitles' claims-map.js
          grep -q 'function loadNearbyExtracts' claims-map.js
          grep -q 'function canadaCamps' claims-map.js
          grep -q 'function claimKey' claims-map.js
          grep -q '|xy|' claims-map.js
          grep -q 'id="camps"' claims.html
          grep -q 'claims/extract-bytes.json' claims-map.js
          grep -q 'NEARBY_PAD_DEG' claims-map.js
          grep -q 'downloadVisibleClaims' claims-map.js
          grep -q 'Download neighbors' claims.html
          grep -q 'id="download-neighbors"' claims.html
          grep -q 'Select a company first' claims.html
          grep -q 'function downloadNeighbors' claims-map.js
          grep -q 'qc-claims-neighbors-' claims-neighbors.js
          grep -q 'function buildNeighborRows' claims-neighbors.js
          grep -q 'insider-companies.json' claims-map.js
          if grep -n 'loadAllExtracts' claims-map.js; then
            echo "loadAllExtracts must not return (overview-first)" >&2
            exit 1
          fi
          echo "claims HUD hooks ok"

      - name: Neighbor sheet matching
        run: node scripts/check_claims_neighbors.js
