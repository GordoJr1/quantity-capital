<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c2430" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Quantity" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />
  <title>Quantity Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --steel: #1c2430;
      --panel: #2a3340;
      --paper: #d8dde3;
      --white: #eef2f5;
      --fed: #1e4b8a;
      --red: #c2302a;
      --caution: #e3b41a;
      --mute: #8b96a3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--steel); color-scheme: dark; }
    body { font-family: "IBM Plex Sans", sans-serif; color: var(--white); background: var(--steel); }
    @media (display-mode: standalone) {
      body { padding-top: env(safe-area-inset-top, 0px); }
    }
    .stripe {
      height: 10px;
      background: repeating-linear-gradient(-45deg, #111 0 10px, var(--caution) 10px 20px);
    }
    .wrap { width: min(1680px, calc(100% - 48px)); margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0; border-bottom: 2px solid var(--caution);
    }
    .mark, h1, h2, th, .kicker, .back {
      font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .mark { font-weight: 700; letter-spacing: 0.18em; }
    .mark span { color: var(--red); }
    .back { color: var(--caution); text-decoration: none; }
    .kicker { color: var(--caution); margin: 28px 0 8px; }
    h1 { font-size: clamp(2.4rem, 6vw, 4rem); line-height: 0.9; margin-bottom: 10px; }
    .bio-wrap {
      margin: 8px 0 22px;
      border: 1px solid #4a5563;
      background: #151b24;
    }
    .bio-wrap > summary {
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--caution);
      cursor: pointer;
      padding: 12px 16px;
      list-style: none;
    }
    .bio-wrap > summary::-webkit-details-marker { display: none; }
    .bio-wrap > summary::before {
      content: "▸ ";
    }
    .bio-wrap[open] > summary::before {
      content: "▾ ";
    }
    .bio-wrap > summary:hover { background: rgba(227, 180, 26, 0.08); }
    .bio {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 0 14px 14px;
      align-items: start;
      grid-template-areas:
        "office overlap"
        "economy overlap"
        "committees overlap"
        "subs subs";
    }
    .bio .office { grid-area: office; }
    .bio .economy { grid-area: economy; }
    .bio .committees { grid-area: committees; }
    .bio .overlap { grid-area: overlap; border-left-color: var(--caution); }
    .bio .subs { grid-area: subs; }
    .bio .overlap li { margin: 6px 0; color: var(--paper); }
    .bio .overlap strong {
      color: var(--white);
      margin-right: 6px;
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.06em;
    }
    .bio .overlap .why { color: var(--caution); font-size: 0.88rem; }
    .bio .subhead {
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--caution);
      font-size: 0.85rem;
      margin: 12px 0 4px;
    }
    .bio .subs .subhead:first-child { margin-top: 0; }
    .bio .subs ul { margin-bottom: 4px; }
    .bio article {
      background: var(--panel);
      border: 1px solid #4a5563;
      border-left: 6px solid var(--fed);
      padding: 16px 18px;
    }
    .bio h3 {
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--caution);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .bio p, .bio li { color: var(--paper); line-height: 1.5; }
    .bio ul { padding-left: 18px; }
    .bio li { margin: 4px 0; }
    .muted { color: var(--mute); font-size: 0.88rem; }
    @media (max-width: 820px) {
      .wrap { width: calc(100% - 24px); }
      header { padding: 12px 0; }
      h1 { font-size: clamp(1.8rem, 10vw, 2.6rem); }
      .bio {
        grid-template-columns: 1fr;
        grid-template-areas:
          "office"
          "economy"
          "committees"
          "overlap"
          "subs";
      }

      table.tape-table thead { display: none; }
      table.tape-table, table.tape-table tbody { display: block; width: 100%; }
      table.tape-table tr {
        display: grid;
        grid-template-columns: 58px 1fr auto;
        grid-template-areas:
          "stamp ticker side"
          "stamp amt amt"
          "stamp meta meta";
        gap: 3px 10px;
        margin: 0 0 8px;
        border: 1px solid #4a5563;
        background: var(--panel);
        padding: 10px 12px;
      }
      table.tape-table td { display: block; padding: 0; border: 0; }
      table.tape-table td::before { content: none; }
      table.tape-table .desk-only { display: none; }
      table.tape-table .tix-stamp {
        display: flex;
        grid-area: stamp;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-right: 1px solid #3a4452;
        padding-right: 8px;
        text-align: center;
        font-family: "Barlow Condensed", sans-serif;
      }
      table.tape-table .tix-stamp .mon {
        color: var(--caution);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }
      table.tape-table .tix-stamp .day { font-size: 1.55rem; line-height: 1; font-weight: 700; }
      table.tape-table .tix-stamp .yr { color: var(--mute); font-size: 0.72rem; }
      table.tape-table .tix-stamp .filing-err { margin: 5px 0 0; margin-left: 0; }
      table.tape-table tr.has-err { box-shadow: inset 3px 0 0 var(--red); }
      table.tape-table .tix-tk { grid-area: ticker; font-weight: 600; font-size: 1.05rem; }
      table.tape-table .tix-side { grid-area: side; text-align: right; }
      table.tape-table .tix-amt {
        grid-area: amt;
        color: var(--caution);
        font-family: "Barlow Condensed", sans-serif;
        font-size: 1.1rem;
      }
      table.tape-table .tix-meta {
        display: block;
        grid-area: meta;
        color: var(--mute);
        font-size: 0.8rem;
      }
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      margin: 0 0 16px;
      border: 1px solid #4a5563;
      background: var(--panel);
    }
    .stat {
      padding: 8px 10px;
      min-width: 0;
      border-right: 1px solid #3a4452;
    }
    .stat:last-child { border-right: 0; }
    .stat b {
      display: inline;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.15rem;
      color: var(--caution);
      margin-right: 6px;
    }
    .stat span { color: var(--mute); font-size: 0.75rem; }

    .holdings {
      margin: 0 0 28px;
      border: 1px solid #4a5563;
      background: #151b24;
      padding: 16px 18px 18px;
    }
    .holdings h2 { font-size: 1.15rem; margin: 0 0 6px; }
    .holdings > .muted { margin-bottom: 16px; line-height: 1.45; }
    .hold-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 28px 32px;
      align-items: center;
    }
    .donut-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto;
    }
    .donut {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }
    .donut-hole {
      position: absolute;
      inset: 27%;
      border-radius: 50%;
      background: #151b24;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
    }
    .donut-hole b {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.55rem;
      letter-spacing: 0.04em;
      color: var(--caution);
      line-height: 1;
    }
    .donut-hole span { color: var(--mute); font-size: 0.72rem; margin-top: 4px; }
    .hold-list { list-style: none; }
    .hold-list li {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) minmax(56px, 1.4fr) auto auto;
      gap: 8px 10px;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #2c3440;
    }
    .hold-list li:last-child { border-bottom: 0; }
    .swatch { width: 12px; height: 12px; border-radius: 2px; }
    .hold-name b {
      display: block;
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }
    .hold-name small { display: block; color: var(--mute); font-size: 0.75rem; }
    .hold-name em {
      font-style: normal;
      color: var(--caution);
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-left: 8px;
      font-size: 0.78rem;
    }
    .hold-bar {
      height: 7px;
      background: #2c3440;
      border-radius: 99px;
      overflow: hidden;
    }
    .hold-bar i { display: block; height: 100%; border-radius: 99px; }
    .hold-amt {
      font-family: "Barlow Condensed", sans-serif;
      color: var(--caution);
      font-size: 1.05rem;
      white-space: nowrap;
    }
    .hold-pct { color: var(--mute); font-size: 0.8rem; min-width: 2.6em; text-align: right; }
    .hold-more { margin-top: 12px; }
    .hold-toggle {
      background: transparent;
      border: 1px solid #4a5563;
      color: var(--caution);
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 10px 14px;
      cursor: pointer;
      min-height: 44px;
    }
    .hold-toggle:hover { background: rgba(227, 180, 26, 0.08); }
    @media (max-width: 820px) {
      .hold-grid { grid-template-columns: 1fr; }
      .hold-list { width: 100%; }
      .hold-list li {
        grid-template-columns: 12px minmax(0, 1fr) auto auto;
      }
      .hold-bar { display: none; }
    }
    table { width: 100%; border-collapse: collapse; background: var(--panel); }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #3a4452; }
    th { color: var(--caution); font-weight: 600; letter-spacing: 0.1em; }
    .tix-meta, .tix-stamp { display: none; }
    .co { display: block; color: var(--paper); font-weight: 500; }
    .ind { display: block; color: var(--mute); font-size: 0.82rem; }
    .buy { color: #7dcf7a; }
    .sell { color: #ef7a74; }
    .filing-err {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border: 1px solid var(--red);
      color: var(--red);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      vertical-align: middle;
      white-space: nowrap;
    }
    footer {
      border-top: 2px solid var(--caution); margin-top: 40px; padding: 18px 0 36px;
      font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute);
    }
  </style>
</head>
<body>
  <div class="stripe"></div>
  <div class="wrap">
    <header>
      <div class="mark">Quantity <span>Capital</span></div>
      <a class="back" href="index.html#tape">← Tape</a>
    </header>

    <p class="kicker">3 year history</p>
    <h1 id="who">Member</h1>
    <details class="bio-wrap">
      <summary>Bio</summary>
      <div class="bio" id="bio"></div>
    </details>
    <div class="stats" id="stats"></div>
    <section class="holdings" id="holdings" hidden></section>
    <p class="kicker">Trade tape</p>
    <table class="tape-table">
      <thead>
        <tr>
          <th>Trade date</th>
          <th>Filed</th>
          <th>Side</th>
          <th>Ticker</th>
          <th>Company</th>
          <th>Industry</th>
          <th>Amount range</th>
          <th>Owner</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <footer>Not investment advice · STOCK Act ranges, not share counts</footer>
  </div>
  <script>
    const fallback = {
      trades: [
        { filer: "Nancy Pelosi", filer_id: "nancy-pelosi", ticker: "NVDA", side: "purchase", amount: "$1,000,001–$5,000,000", trade_date: "2026-07-02", filed_date: "2026-08-12", owner: "spouse" },
        { filer: "Nancy Pelosi", filer_id: "nancy-pelosi", ticker: "AAPL", side: "sale", amount: "$250,001–$500,000", trade_date: "2026-03-18", filed_date: "2026-04-22", owner: "spouse" },
        { filer: "Nancy Pelosi", filer_id: "nancy-pelosi", ticker: "NVDA", side: "purchase", amount: "$500,001–$1,000,000", trade_date: "2025-11-04", filed_date: "2025-12-15", owner: "spouse" },
        { filer: "Nancy Pelosi", filer_id: "nancy-pelosi", ticker: "MSFT", side: "purchase", amount: "$100,001–$250,000", trade_date: "2025-06-11", filed_date: "2025-07-20", owner: "spouse" },
        { filer: "Nancy Pelosi", filer_id: "nancy-pelosi", ticker: "GOOGL", side: "sale", amount: "$50,001–$100,000", trade_date: "2024-09-09", filed_date: "2024-10-18", owner: "spouse" },
        { filer: "Nancy Pelosi", filer_id: "nancy-pelosi", ticker: "NVDA", side: "purchase", amount: "$1,000,001–$5,000,000", trade_date: "2024-01-22", filed_date: "2024-02-28", owner: "spouse" },
        { filer: "Nancy Pelosi", filer_id: "nancy-pelosi", ticker: "TSLA", side: "sale", amount: "$250,001–$500,000", trade_date: "2023-10-03", filed_date: "2023-11-14", owner: "spouse" },
        { filer: "Nancy Pelosi", filer_id: "nancy-pelosi", ticker: "AMZN", side: "purchase", amount: "$100,001–$250,000", trade_date: "2023-05-16", filed_date: "2023-06-27", owner: "spouse" }
      ]
    };

    const id = new URLSearchParams(location.search).get("id");
    if (!id) {
      location.replace("index.html#tape");
    }
    const cutoff = new Date();
    cutoff.setFullYear(cutoff.getFullYear() - 3);

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function shortSeat(name) {
      return String(name || "").replace(/^Senate Committee on\s+/i, "");
    }

    function listHtml(items) {
      if (!items || !items.length) return "<p class=\"muted\">None listed on the current roster.</p>";
      return "<ul>" + items.map((c) => {
        const title = c.title ? " — " + esc(c.title) : "";
        return "<li>" + esc(shortSeat(c.name)) + title + "</li>";
      }).join("") + "</ul>";
    }

    function subsHtml(items) {
      if (!items || !items.length) return "<p class=\"muted\">None listed on the current roster.</p>";
      const groups = new Map();
      items.forEach((c) => {
        const parts = String(c.name || "").split(/\s+[—–-]\s+/);
        const parent = shortSeat(parts[0] || "Other");
        const child = parts.length > 1 ? parts.slice(1).join(" — ") : shortSeat(c.name);
        if (!groups.has(parent)) groups.set(parent, []);
        groups.get(parent).push({ child: child, title: c.title || "" });
      });
      let html = "";
      groups.forEach((rows, parent) => {
        html += "<p class=\"subhead\">" + esc(parent) + "</p><ul>";
        rows.forEach((r) => {
          html += "<li>" + esc(r.child) + (r.title ? " — " + esc(r.title) : "") + "</li>";
        });
        html += "</ul>";
      });
      return html;
    }

    const OVERLAP_RULES = [
      {
        seat: /environment and public works|clean air, climate, and nuclear|energy and natural resources|interior, environment/i,
        industry: /electric services|petroleum refining|crude petroleum|natural gas|coal mining|metal mining|gas transmission|gas distribution/i,
        name: /constellation energy|chevron|exxon|conocophillips|occidental|valero|phillips 66|kinder morgan|cheniere|duke energy|nextera|sempra|dominion|exelon|firstenergy|freeport/i,
        why: "Energy / environment"
      },
      {
        seat: /chemical safety|waste management/i,
        industry: /industrial organic chemical|plastic material|paints|coatings|agricultural chemical/i,
        name: /sherwin-williams|dow inc|dow chemical|dupont|celanese|carlisle|air products|ppg industries|lyondell/i,
        why: "Chemical safety"
      },
      {
        seat: /labor, health|health and human|public health/i,
        industry: /pharmaceutical|hospital & medical|biological product/i,
        name: /eli lilly|unitedhealth|pfizer|merck|abbvie|zoetis|johnson & johnson|cigna|elevance|humana|medtronic|abbott|amgen|bristol|gilead|moderna|regeneron/i,
        why: "Health funding (HHS)"
      },
      {
        seat: /telecommunication|telecommunications and media|consumer protection, technology|data privacy/i,
        industry: /semiconductor|prepackaged software|cable & other pay|telephone|radio & tv|computer communications|computer programming|data proc/i,
        name: /alphabet|google|meta platforms|facebook|cisco|comcast|broadcom|apple|microsoft|verizon|at&t|t-mobile|nvidia|intel|qualcomm|oracle/i,
        why: "Tech / telecom"
      },
      {
        seat: /aviation, space|department of defense|armed services|intelligence/i,
        industry: /aircraft|aerospace|guided missile|ordnance/i,
        name: /boeing|lockheed|rtx\b|raytheon|northrop|general dynamics|ge aerospace|l3harris|transdigm|palantir/i,
        why: "Defense / aviation"
      },
      {
        seat: /surface transportation|freight, pipelines|transportation and infrastructure/i,
        industry: /railroad|trucking|air transportation, scheduled|transportation services/i,
        name: /union pacific|norfolk southern|csx|fedex|ups|prologis|delta air|southwest air|united airlines|kinder morgan|enbridge/i,
        why: "Transportation / freight"
      },
      {
        seat: /\bbanking\b|committee on finance|financial services/i,
        industry: /national commercial bank|state commercial bank/i,
        name: /jpmorgan|bank of america|wells fargo|goldman|morgan stanley|pnc financial|citigroup/i,
        why: "Financial services"
      },
      {
        seat: /agriculture|nutrition|forestry/i,
        industry: /agriculture|meat packing|grain mill|farm machinery/i,
        name: /archer-daniels|tyson foods|mondelez|general mills|deere|corteva/i,
        why: "Agriculture"
      }
    ];

    function findOverlaps(bio, rows, file) {
      const seats = []
        .concat((bio && bio.committees) || [])
        .concat((bio && bio.subcommittees) || []);
      if (!seats.length) return [];
      const byCode = new Map();
      rows.filter((t) => t.side === "purchase").forEach((t) => {
        const info = tickerInfo(t, file);
        const blob = (info.code + " " + info.name).toLowerCase();
        const industry = info.industry || "";
        seats.forEach((seat) => {
          OVERLAP_RULES.forEach((rule) => {
            if (!rule.seat.test(seat.name || "")) return;
            if (!rule.industry.test(industry) && !rule.name.test(blob)) return;
            const prev = byCode.get(info.code);
            if (!prev) {
              byCode.set(info.code, { code: info.code, name: info.name, why: rule.why });
              return;
            }
            if (prev.why.indexOf(rule.why) === -1) prev.why += "; " + rule.why;
          });
        });
      });
      return Array.from(byCode.values()).sort((a, b) => a.code.localeCompare(b.code));
    }

    function overlapHtml(items) {
      if (!items.length) {
        return "<p class=\"muted\">No 3-year stock buys matched this member’s current committee jurisdictions.</p>";
      }
      return "<ul>" + items.map((o) =>
        "<li><strong>" + esc(o.code) + "</strong>" + esc(o.name) +
        " <span class=\"why\">" + esc(o.why) + "</span></li>"
      ).join("") + "</ul>" +
        "<p class=\"muted\">Jurisdictional overlap only. Not proof of illegal trading.</p>";
    }

    function paintBio(bio, overlaps) {
      const box = document.getElementById("bio");
      if (!bio) {
        box.innerHTML = "<article><h3>Bio</h3><p class=\"muted\">No official bio matched this filer yet.</p></article>";
        return;
      }
      const elected = bio.first_elected_senate
        ? "First elected to the Senate in " + bio.first_elected_senate + "."
        : bio.first_elected_house
          ? "First elected to the House in " + bio.first_elected_house + "."
          : "Election year not on file.";
      const term = (bio.term_start && bio.term_end)
        ? " Current term " + bio.term_start + "–" + bio.term_end + "."
        : "";
      const party = bio.party ? " · " + bio.party : "";
      box.innerHTML =
        "<article class=\"office\"><h3>Office</h3><p><strong>" + esc(bio.name) + "</strong>" + esc(party) + "<br>" +
        "State: " + esc(bio.state) +
        (bio.district ? "-" + esc(String(bio.district).padStart(2, "0")) : "") +
        (bio.chamber ? " · " + esc(bio.chamber) : "") + "<br>" + elected + term + "</p></article>" +
        "<article class=\"economy\"><h3>State economy</h3><p>" + esc(bio.state_economy || "—") + "</p></article>" +
        "<article class=\"committees\"><h3>Committees</h3>" + listHtml(bio.committees) + "</article>" +
        "<article class=\"overlap\"><h3>Conflicts</h3>" +
        "<p class=\"muted\">3-year stock buys in industries these committees oversee.</p>" +
        overlapHtml(overlaps || []) + "</article>" +
        "<article class=\"subs\"><h3>Subcommittees</h3>" + subsHtml(bio.subcommittees) + "</article>";
    }

    function tickerInfo(t, file) {
      const lookup = (file && file.tickers) || {};
      const extra = ((file && file.assets) || {})[t.asset] || {};
      const code = (t.ticker || extra.ticker || "").toUpperCase();
      const meta = lookup[code] || {};
      const bondLike = /bond|municipal/i.test(t.asset_type || "") || /rate\/coupon/i.test(t.asset || "");
      const name = bondLike ? (t.asset || meta.name || "—") : (meta.name || cleanAsset(t.asset) || "—");
      const industry = meta.industry || extra.industry || "—";
      return { code: code || "—", name, industry };
    }

    function cleanAsset(s) {
      return String(s || "").replace(/\s+(Common Stock.*|Class [A-Z].*)$/i, "").trim();
    }

    function threeYearRows(data) {
      return (data.trades || []).filter((t) => t.filer_id === id && new Date(t.trade_date) >= cutoff)
        .sort((a, b) => b.trade_date.localeCompare(a.trade_date));
    }

    const BAD_TICKERS = { LLC: 1, THE: 1, AND: 1, INC: 1, CORP: 1, CLASS: 1, NONE: 1, NA: 1 };
    const SLICE = ["#e3b41a", "#3db8c4", "#1e4b8a", "#7dcf7a", "#ef7a74", "#9b7ed9", "#e08a4a", "#6b7582"];

    function amountHigh(amount) {
      const nums = String(amount || "").match(/\$[\d,]+/g);
      if (!nums || !nums.length) return 0;
      return parseInt(nums[nums.length - 1].replace(/[$,]/g, ""), 10) || 0;
    }

    function isBond(t) {
      const type = (t.asset_type || "").toLowerCase();
      const asset = (t.asset || "").toLowerCase();
      return type.includes("bond") || type.includes("municipal") || /rate\/coupon/.test(asset);
    }

    function isOptionLike(t) {
      const type = (t.asset_type || "").toLowerCase();
      const asset = (t.asset || "").toLowerCase();
      return type.includes("option") || /exercised|call option|put option|strike pric/.test(asset);
    }

    function formatMoney(n) {
      if (n >= 1000000) {
        const m = n / 1000000;
        const s = (m >= 10 ? m.toFixed(0) : m.toFixed(1)).replace(/\.0$/, "");
        return "$" + s + "M";
      }
      if (n >= 1000) return "$" + Math.round(n / 1000) + "K";
      return "$" + n.toLocaleString("en-US");
    }

    function prettyDate(iso) {
      const d = new Date(String(iso || "") + "T00:00:00");
      if (isNaN(d.getTime())) return iso || "—";
      return d.toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function formatPct(value, total) {
      if (!total) return "0%";
      const p = (value / total) * 100;
      if (p > 0 && p < 1) return "<1%";
      const rounded = Math.round(p);
      if (rounded === 100 && value < total) return "99%";
      return rounded + "%";
    }

    function tidyName(name) {
      return String(name || "").replace(/\s+-\s*$/, "").trim();
    }

    function holdingIdentity(t, lookup) {
      if (isBond(t)) {
        return { key: "BONDS", label: "Bonds", name: "Municipal and corporate bonds", kind: "bond" };
      }
      const info = tickerInfo(t, lookup);
      const code = (info.code || "").toUpperCase();
      if (code && code !== "—" && !BAD_TICKERS[code] && /^[A-Z][A-Z0-9.]{0,6}$/.test(code)) {
        return { key: "T:" + code, label: code, name: tidyName(info.name), kind: "stock" };
      }
      const name = tidyName((info.name && info.name !== "—") ? info.name : (cleanAsset(t.asset) || "Other"));
      const short = name.length > 34 ? name.slice(0, 32) + "…" : name;
      return { key: "A:" + name.toUpperCase(), label: short, name: name, kind: "other" };
    }

    function buildHoldings(rows, lookup) {
      const book = new Map();
      let latest = "";
      rows.forEach((t) => {
        if ((t.filed_date || "") > latest) latest = t.filed_date;
      });
      rows.slice().sort((a, b) => {
        const td = (a.trade_date || "").localeCompare(b.trade_date || "");
        return td !== 0 ? td : (a.filed_date || "").localeCompare(b.filed_date || "");
      }).forEach((t) => {
        if (t.side === "exchange" || isOptionLike(t)) return;
        const hi = amountHigh(t.amount);
        if (!hi) return;
        const idn = holdingIdentity(t, lookup);
        const prev = book.get(idn.key) || { key: idn.key, label: idn.label, name: idn.name, kind: idn.kind, value: 0, buys: 0, sells: 0 };
        if (t.side === "purchase") { prev.value += hi; prev.buys += 1; }
        else if (t.side === "sale") { prev.value -= hi; prev.sells += 1; }
        book.set(idn.key, prev);
      });
      const positions = Array.from(book.values()).filter((p) => p.value > 0).sort((a, b) => b.value - a.value);
      const total = positions.reduce((sum, p) => sum + p.value, 0);
      return { latest: latest, positions: positions, total: total };
    }

    function chartSlices(positions) {
      const cap = 7;
      if (positions.length <= cap) return positions.slice();
      const head = positions.slice(0, cap - 1);
      const rest = positions.slice(cap - 1);
      const value = rest.reduce((sum, p) => sum + p.value, 0);
      const buys = rest.reduce((sum, p) => sum + (p.buys || 0), 0);
      const sells = rest.reduce((sum, p) => sum + (p.sells || 0), 0);
      head.push({ label: "Other", name: rest.length + " more positions", kind: "other", value: value, buys: buys, sells: sells });
      return head;
    }

    function paintHoldings(rows, lookup) {
      const box = document.getElementById("holdings");
      const book = buildHoldings(rows, lookup || {});
      if (!book.positions.length) {
        box.hidden = false;
        box.innerHTML = "<p class=\"kicker\">Estimated book</p><h2>Holdings</h2>" +
          "<p class=\"muted\">No residual positions after netting the 3-year tape at the high end of each official range.</p>";
        return;
      }
      const slices = chartSlices(book.positions);
      let acc = 0;
      const stops = slices.map((s, i) => {
        const start = acc;
        acc += (s.value / book.total) * 100;
        return SLICE[i % SLICE.length] + " " + start.toFixed(2) + "% " + acc.toFixed(2) + "%";
      }).join(", ");
      const shown = { all: false };
      const colorFor = (p, i, list) => {
        if (list === slices) return SLICE[i % SLICE.length];
        const hit = slices.findIndex((s) => s.key === p.key);
        if (hit >= 0) return SLICE[hit % SLICE.length];
        return SLICE[slices.length - 1];
      };
      const rowHtml = (p, i, list) => {
        const pct = formatPct(p.value, book.total);
        const barPct = book.total ? Math.max(1, Math.round((p.value / book.total) * 100)) : 0;
        const sliceColor = colorFor(p, i, list);
        const buyLabel = p.buys ? (p.buys === 1 ? "1 buy" : p.buys + " buys") : "";
        return "<li>" +
          "<span class=\"swatch\" style=\"background:" + sliceColor + "\"></span>" +
          "<span class=\"hold-name\"><b>" + esc(p.label) +
          (buyLabel ? "<em>" + buyLabel + "</em>" : "") +
          "</b><small>" + esc(p.name) + "</small></span>" +
          "<span class=\"hold-bar\"><i style=\"width:" + barPct + "%;background:" + sliceColor + "\"></i></span>" +
          "<span class=\"hold-amt\">" + formatMoney(p.value) + "</span>" +
          "<span class=\"hold-pct\">" + pct + "</span></li>";
      };
      const extra = book.positions.slice(slices.length - (book.positions.length > slices.length ? 1 : 0));
      const renderList = () => {
        const list = shown.all ? slices.slice(0, -1).concat(extra.slice(0, 40)) : slices;
        const moreLeft = extra.length > 40 && shown.all;
        return "<ol class=\"hold-list\">" + list.map((p, i) => rowHtml(p, i, list)).join("") + "</ol>" +
          (book.positions.length > slices.length
            ? "<div class=\"hold-more\"><button type=\"button\" class=\"hold-toggle\">" +
              (shown.all ? "Show chart breakdown" : "Show more names") +
              "</button>" + (moreLeft ? "<p class=\"muted\">Showing 40 of " + extra.length + " smaller positions.</p>" : "") +
              "</div>"
            : "");
      };
      box.hidden = false;
      box.innerHTML =
        "<p class=\"kicker\">Estimated book</p>" +
        "<h2>Holdings</h2>" +
        "<p class=\"muted\">High end of official ranges, through the " + prettyDate(book.latest) +
        " filing. Bonds grouped. Inferred from the 3-year tape — not an official holdings list.</p>" +
        "<div class=\"hold-grid\">" +
          "<div class=\"donut-wrap\"><div class=\"donut\" style=\"background:conic-gradient(" + stops + ")\"></div>" +
          "<div class=\"donut-hole\"><b>" + formatMoney(book.total) + "</b><span>high-end est.</span></div></div>" +
          "<div id=\"hold-list-wrap\">" + renderList() + "</div>" +
        "</div>";
      const wrap = document.getElementById("hold-list-wrap");
      if (wrap) {
        wrap.addEventListener("click", (e) => {
          if (!e.target.closest(".hold-toggle")) return;
          shown.all = !shown.all;
          wrap.innerHTML = renderList();
        });
      }
    }

    function paint(rows, lookup) {
      if (rows[0]) document.getElementById("who").textContent = rows[0].filer;
      const buys = rows.filter((t) => t.side === "purchase").length;
      const sells = rows.filter((t) => t.side === "sale").length;
      document.getElementById("stats").innerHTML =
        '<div class="stat"><b>' + rows.length + '</b><span>trades</span></div>' +
        '<div class="stat"><b>' + buys + '</b><span>buys</span></div>' +
        '<div class="stat"><b>' + sells + '</b><span>sells</span></div>';
      document.getElementById("rows").innerHTML = rows.map((t) => {
        const cls = t.side === "purchase" ? "buy" : "sell";
        const info = tickerInfo(t, lookup || {});
        const meta = [info.name, info.industry, t.owner].filter(Boolean).join(" · ");
        const d = new Date(String(t.trade_date || "") + "T00:00:00");
        const mon = isNaN(d.getTime()) ? "—" : d.toLocaleString("en-US", { month: "short" }).toUpperCase();
        const day = isNaN(d.getTime()) ? "—" : String(d.getDate()).padStart(2, "0");
        const yr = isNaN(d.getTime()) ? "" : d.getFullYear();
        const bad = (t.trade_date || "").length >= 10 && (t.filed_date || "").length >= 10 && t.trade_date > t.filed_date;
        const flag = bad ? "<span class=\"filing-err\" title=\"Trade date is after the filed date on the official PTR.\">Filing error</span>" : "";
        return "<tr" + (bad ? " class=\"has-err\"" : "") + ">" +
          "<td class=\"tix-stamp\"><span class=\"mon\">" + mon + "</span><span class=\"day\">" + day +
          "</span><span class=\"yr\">" + yr + "</span>" + flag + "</td>" +
          "<td class=\"desk-only\">" + t.trade_date + flag + "</td>" +
          "<td class=\"desk-only\">" + t.filed_date + "</td>" +
          "<td class=\"tix-side " + cls + "\">" + t.side + "</td>" +
          "<td class=\"tix-tk\">" + esc(info.code) + "</td>" +
          "<td class=\"desk-only\"><span class=\"co\">" + esc(info.name) + "</span></td>" +
          "<td class=\"desk-only\"><span class=\"ind\">" + esc(info.industry) + "</span></td>" +
          "<td class=\"tix-amt\">" + t.amount + "</td>" +
          "<td class=\"desk-only\">" + t.owner + "</td>" +
          "<td class=\"tix-meta\">" + esc(meta) + "</td></tr>";
      }).join("");
    }

    Promise.all([
      fetch("trades.json").then((r) => r.json()).catch(() => fallback),
      fetch("bios.json").then((r) => r.json()).catch(() => ({ people: {} })),
      fetch("tickers.json").then((r) => r.json()).catch(() => ({ tickers: {} }))
    ]).then(([data, bios, tickerFile]) => {
      const rows = threeYearRows(data);
      const bio = (bios.people || {})[id] || null;
      paint(rows, tickerFile || {});
      paintHoldings(rows, tickerFile || {});
      paintBio(bio, findOverlaps(bio, rows, tickerFile || {}));
      const fromTrades = (data.trades || []).find((t) => t.filer_id === id);
      const shown = ((bios.people || {})[id] && bios.people[id].name)
        || (fromTrades && fromTrades.filer)
        || "";
      if (shown) {
        document.getElementById("who").textContent = shown;
        document.title = shown + " — Quantity Capital";
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
  <script src="refresh.js"></script>
</body>
</html>
