# Rebuild insider-follow.json after the off-repo collector pushes a new
# tape. Daily-update also runs the same script after the price refresh.
name: follow-alerts
on:
  push:
    branches: [main]
    paths:
      - insider-trades-lite.json
      - build-insider-follow.py
  workflow_dispatch:

concurrency:
  group: follow-alerts
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  deployments: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild follow list and alerts
        run: |
          set -euo pipefail
          python3 build-insider-follow.py

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insider-follow.json
          if git diff --staged --quiet; then
            echo "no follow-list changes"
            exit 0
          fi
          git commit -m "Follow-list alerts $(date -u +%F)"
          git pull --rebase origin main
          git push
          sleep 8
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
