    .focus .mark-pop .pop-title-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .focus .mark-pop .pop-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .focus .mark-pop .pop-badge.buy {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.5);
    }
    .focus .mark-pop .pop-badge.sell {
      background: rgba(248, 113, 113, 0.2);
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.5);
    }
    .focus .mark-pop .pop-title {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.02rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .focus .mark-pop .pop-close {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11.5px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
    }
    .focus .mark-pop .pop-close:hover { background: rgba(255, 255, 255, 0.2); color: #ffffff; }
    .focus .mark-pop .pop-single-detail {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      margin: 5px 0 2px;
      font-family: "JetBrains Mono", monospace;
      font-size: 11.5px;
    }
    .focus .mark-pop .pop-single-amt { color: #ffffff; font-weight: 700; }
    .focus .mark-pop .pop-dot { color: #64748b; margin: 0 1px; }
    .focus .mark-pop .pop-single-date { color: #38bdf8; font-weight: 600; }
    .focus .chart-y {
      position: absolute;
      left: 0;
      pointer-events: none;
      z-index: 4;
      display: block;
      padding: 0;
      overflow: visible;
    }
    .focus .chart-y span {
      position: absolute;
      left: 0;
      right: 0;
      width: 100%;
      text-align: right;
      transform: translateY(-50%);
      padding-right: 6px;
      padding-left: 2px;
      box-sizing: border-box;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      font-family: "IBM Plex Sans", sans-serif;
      line-height: 1;
      white-space: nowrap;
    }
    .focus .chart-x {
      display: flex;
      justify-content: space-between;
      padding: 8px 16px 0 28px;
      color: #e2e8f0;
      font-size: 11.5px;
      font-weight: 700;
      font-family: "IBM Plex Sans", sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .focus .chart-note {
      color: var(--mute);
      font-size: 0.8rem;
      padding: 18px 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <a class="qc-skip" href="#main">Skip to content</a>
  <header class="qc-header">
    <div class="wrap qc-header-inner">
      <a class="mark" href="index.html">Quantity <span>Capital</span></a>
      <nav class="qc-nav" aria-label="Insider tape">
        <a href="insiders.html" class="on" aria-current="page" title="Officer trade tape">Tape</a>
        <a href="insider-landed.html" title="New insider filings">Filed</a>
        <a href="insider-signals.html" title="Insider buy heat">Heat</a>
        <a href="insider-board.html" title="Officer leaderboard">Leaders</a>
        <a href="insider-checks.html" title="Price-file hygiene">Checks</a>
      </nav>
      <a class="qc-mode" href="index.html" title="Politician STOCK Act tape">Politicians</a>
    </div>
  </header>
  <div class="wrap" id="main">
    <p class="asof" id="asof"></p>
    <div class="sub-bar">
      <p class="kicker">Officer tape</p>
    </div>
    <h1>Insiders</h1>
    <div class="windows" id="windows"></div>
    <div class="picker">
      <input id="q" type="search" placeholder="Search officer, ticker, or company" autocomplete="off" />
    </div>
    <div class="desk" id="desk">
      <div class="wire-col">
        <ol class="qc-txn-list qc-tape-list" id="rows"></ol>
      </div>
      <aside class="focus" id="focus">
        <div id="focus-head"></div>
        <div class="focus-chart" id="focus-chart">
          <div class="range" id="range" role="tablist" aria-label="Chart range"></div>
          <div class="chart-wrap" id="chart-wrap">
            <div class="chart-frame">
              <svg id="chart-svg" viewBox="0 0 840 198" preserveAspectRatio="none"></svg>
              <div class="chart-x" id="chart-x"></div>
            </div>
            <div class="chart-y" id="chart-y" aria-hidden="true"></div>
            <div class="mark-pop" id="mark-pop" hidden></div>
          </div>
        </div>
        <div id="focus-foot"></div>
      </aside>
    </div>
  </div>
  <footer>
    <div class="wrap">
      <span>© Quantity Capital</span>
      <a href="mailto:gordojr@proton.me">Transmit</a>
    </div>
  </footer>
  <script src="qc.js?v=110"></script>
  <script src="chart.js"></script>
  <script>
    const WINDOWS = [14, 30, 90, 540];
    const CHART_RANGES = ["1m", "3m", "6m", "1y", "3y"];
    const DESK_MQ = window.matchMedia("(min-width: 900px)");
    const params = new URLSearchParams(location.search);
    let days = WINDOWS.indexOf(Number(params.get("w"))) >= 0 ? Number(params.get("w")) : 90;
    let side = params.get("side") || "";
    let q = "";
    let all = [];
    let collected = "";
    let deskRows = [];
    let activeId = "";
    let chartRange = "3m";
    let chartToken = 0;
    const priceCache = {};

    function labelW(d) {
      if (d <= 14) return "14 days";
      if (d <= 30) return "30 days";
      if (d <= 90) return "90 days";
      return "18 months";
    }
    function newestFirst(a, b) {
      const traded = String(b.trade_date || "").localeCompare(String(a.trade_date || ""));
      if (traded) return traded;
      const filed = String(b.filed_date || "").localeCompare(String(a.filed_date || ""));
      if (filed) return filed;
      const added = String(b.added || "").localeCompare(String(a.added || ""));
      if (added) return added;
      return String(b.id || "").localeCompare(String(a.id || ""));
    }
    function activeTrade() {
      return deskRows.find((t) => t.id === activeId) || null;
    }
    function esc(s) { return QC.esc(s); }

    function paint(rows, collectedAt) {
      document.getElementById("asof").textContent = QC.asOfLabel(collectedAt);
      document.getElementById("windows").innerHTML =
        WINDOWS.map((d) => "<button type=\"button\" class=\"chip" + (d === days ? " on" : "") + "\" data-w=\"" + d + "\">" + labelW(d) + "</button>").join("") +
        "<button type=\"button\" class=\"chip" + (side === "purchase" ? " on" : "") + "\" data-side=\"purchase\">Buys</button>" +
        "<button type=\"button\" class=\"chip" + (side === "sale" ? " on" : "") + "\" data-side=\"sale\">Sells</button>";
      const cut = new Date(); cut.setDate(cut.getDate() - days);
      const cutIso = cut.toISOString().slice(0, 10);
      const needle = q.trim().toLowerCase();
      const vis = rows.filter((t) => {
        const day = t.filed_date || t.trade_date || "";
        if (day && day < cutIso) return false;
        if (side === "purchase" && !QC.isMarketBuy(t)) return false;
        if (side === "sale" && !QC.isMarketSale(t)) return false;
        if (needle) {
          const blob = [t.filer, t.title, t.ticker, t.company].join(" ").toLowerCase();
          if (!blob.includes(needle)) return false;
        }
        return true;
      }).sort(newestFirst);
      deskRows = vis.slice(0, 400);
      if (!deskRows.some((t) => t.id === activeId)) {
        activeId = deskRows[0] ? deskRows[0].id : "";
        chartRange = "3m";
      }
      const slim = DESK_MQ.matches;
      const tradeHtml = deskRows.map((t) =>
        QC.tradeRowHtml(t, {
          variant: "tape",
          nameHref: t.filer_id ? "insider.html?id=" + encodeURIComponent(t.filer_id) : ""
        })
      ).join("");
      const colsHtml = "<li class=\"qc-txn-cols\" aria-hidden=\"true\">" +
        "<span class=\"qc-txn-date\">Date</span>" +
        "<span class=\"qc-txn-id\">Name</span>" +
        "<span class=\"qc-txn-company\">Ticker</span>" +
        "<span class=\"qc-txn-coname\">Company</span>" +
        "<span class=\"qc-txn-chip\">Trade</span>" +
        "<span class=\"qc-txn-hero\">Value</span>" +
      "</li>";
      document.getElementById("rows").innerHTML = tradeHtml
        ? colsHtml + tradeHtml
        : "<li class=\"muted\">No insider prints in this window.</li>";
      markActiveRow();
      paintFocus();
      const focusEl = document.getElementById("focus");
      if (focusEl) focusEl.hidden = !slim;
      if (slim) paintChart();
    }

    function markActiveRow() {
      document.querySelectorAll("#rows .qc-txn-tape").forEach((el) => {
        el.classList.toggle("on", el.getAttribute("data-id") === activeId);
      });
    }

    function paintFocus() {
      const head = document.getElementById("focus-head");
      const foot = document.getElementById("focus-foot");
      if (!head || !foot) return;
      const t = activeTrade();
      if (!t) {
        head.innerHTML = "<p class=\"quiet\">Select a print on the tape.</p>";
        foot.innerHTML = "";
        return;
      }
      const role = QC.shortRole(t);
      const fresh = QC.isLanded(t, 72);
      const owner = String(t.owner || "").toLowerCase();
      const code = String(t.ticker || "").toUpperCase();
      const chartable = QC.isChartTicker(code);
      const tickerHtml = chartable
        ? "<a href=\"insider-ticker.html?t=" + encodeURIComponent(code) + "\">" + esc(code) + "</a>"
        : esc(code);
      const name = QC.titleCaseName(t.filer);
      const who = t.filer_id
        ? "<a class=\"who\" href=\"insider.html?id=" + encodeURIComponent(t.filer_id) + "\">" + esc(name) + "</a>"
        : "<span class=\"who\">" + esc(name) + "</span>";
      head.innerHTML =
        who +
        "<div class=\"chips\">" +
          (role ? "<span class=\"ch\">" + esc(role) + "</span>" : "") +
          (owner === "indirect" ? "<span class=\"ch\">Indirect</span>" : "") +
          (fresh ? "<span class=\"ch hot\">Just filed</span>" : "") +
        "</div>" +
        "<p class=\"asset\">" + tickerHtml + " " + esc(t.company || "") + "</p>" +
        "<p class=\"quiet\">" + esc(t.commodity || t.title || "") + "</p>";
      const tickerBtn = chartable
        ? "<a class=\"btn\" href=\"insider-ticker.html?t=" + encodeURIComponent(code) + "\">Open ticker</a>"
        : "";
      const insiderBtn = t.filer_id
        ? "<a class=\"btn fill\" href=\"insider.html?id=" + encodeURIComponent(t.filer_id) + "\">Open insider</a>"
        : "";
      foot.innerHTML = "<div class=\"cta\">" + insiderBtn + tickerBtn + "</div>";
    }

    function loadPrices(ticker) {
      const code = String(ticker || "").toUpperCase();
      if (!code || !QC.isChartTicker(code)) return Promise.resolve(null);
      if (!priceCache[code]) {
        priceCache[code] = fetch("prices/" + encodeURIComponent(code) + ".json")
          .then((r) => r.ok ? r.json() : null)
          .then((d) => (d && d.c && d.c.length >= 2) ? d.c : null)
          .catch(() => null);
      }
      return priceCache[code];
    }

    function paintRange() {
      const box = document.getElementById("range");
      if (!box) return;
      box.innerHTML = CHART_RANGES.map((r) =>
        "<button type=\"button\" class=\"" + (r === chartRange ? "on" : "") + "\" data-r=\"" + r + "\">" +
          r.toUpperCase() + "</button>"
      ).join("");
    }

    function pickRangeForTrade(points, tradeIso, preferred) {
      const order = preferred === "1m"
        ? ["1m", "3m", "6m", "1y", "3y"]
        : ["3m", "6m", "1y", "3y", "1m"];
      const start = Math.max(0, order.indexOf(preferred));
      for (let i = start; i < order.length; i++) {
        const slice = slicePriceRange(points, order[i]);
        if (slice.length >= 2 && tradeIso >= slice[0][0] && tradeIso <= slice[slice.length - 1][0]) {
          return order[i];
        }
      }
      return preferred;
    }

    function hidePop() {
      const pop = document.getElementById("mark-pop");
      if (pop) pop.hidden = true;
    }

    function sideBadge(side) {
      if (side === "sale" || side === "sale_post") return { cls: "sell", label: "SELL" };
      if (side === "purchase") return { cls: "buy", label: "BUY" };
      const label = QC.txnChipLabel({ side: side }) || String(side || "TXN");
      return { cls: "buy", label: label.toUpperCase() };
    }

    function showPop(rec) {
      const pop = document.getElementById("mark-pop");
      const wrap = document.getElementById("chart-wrap");
      if (!pop || !wrap || !rec) return;
      if (typeof hideChartHoverUi === "function") {
        hideChartHoverUi(wrap, document.getElementById("chart-svg"));
      }
      const marks = (rec.marks && rec.marks.length) ? rec.marks : [rec.mark || {}];
      const m = marks[0] || {};
      const badge = sideBadge(rec.side || m.side);
      const val = Number(m.value);
      const amt = (isFinite(val) && val > 0)
        ? "$" + Math.round(val).toLocaleString("en-US")
        : (m.amount ? QC.formatAmountRange(m.amount) : "");
      const sh = m.shares ? QC.formatSharesQuiet(m.shares) : "";
      const px = (m.price != null && isFinite(Number(m.price))) ? QC.formatQuote(m.price) : "";
      const mDate = m.date ? QC.prettyDate(m.date) : "";
      const bits = [];
      if (amt) bits.push("<span class=\"pop-single-amt\">" + esc(amt) + "</span>");
      if (sh) bits.push("<span class=\"pop-single-amt\">" + esc(sh) + " sh</span>");
      if (px) bits.push("<span class=\"pop-single-date\">" + esc(px) + "</span>");
      if (mDate) bits.push("<span class=\"pop-single-date\">" + esc(mDate) + "</span>");
      pop.innerHTML =
        "<div class=\"pop-header\">" +
          "<div class=\"pop-title-wrap\">" +
            "<span class=\"pop-badge " + badge.cls + "\">" + esc(badge.label) + "</span>" +
            "<div class=\"pop-title\" title=\"" + esc(m.filer || "") + "\">" + esc(m.filer || "") + "</div>" +
          "</div>" +
          "<button type=\"button\" class=\"pop-close\" aria-label=\"Close popover\">✕</button>" +
        "</div>" +
        "<div class=\"pop-single-detail\">" +
          bits.join("<span class=\"pop-dot\">·</span>") +
        "</div>";
      const closeBtn = pop.querySelector(".pop-close");
      if (closeBtn) {
        const closeFn = (e) => {
          e.stopPropagation();
          e.preventDefault();
          hidePop();
        };
        closeBtn.addEventListener("click", closeFn);
        closeBtn.addEventListener("touchend", closeFn);
      }
      const svg = document.getElementById("chart-svg");
      const popWidth = Math.min(220, Math.max(160, wrap.getBoundingClientRect().width - 20));
      if (typeof placeMarkPop === "function") {
        placeMarkPop(pop, wrap, svg, rec, { width: popWidth });
      } else {
        const wr = wrap.getBoundingClientRect();
        const sr = svg.getBoundingClientRect();
        pop.style.width = popWidth + "px";
        pop.style.right = "auto";
        pop.style.transform = "none";
        const pinScreenX = (sr.left - wr.left) + rec.xPct * sr.width;
        const pinScreenY = (sr.top - wr.top) + rec.yPct * sr.height;
        let popLeft = pinScreenX - (popWidth / 2);
        popLeft = Math.max(8, Math.min(wr.width - popWidth - 8, popLeft));
        pop.style.left = popLeft + "px";
        if (pinScreenY < 120 || rec.yPct < 0.46) {
          pop.style.top = (pinScreenY + 16) + "px";
          pop.style.bottom = "auto";
        } else {
          pop.style.top = (pinScreenY - 16) + "px";
          pop.style.bottom = "auto";
          pop.style.transform = "translateY(-100%)";
        }
      }
      pop.hidden = false;
    }

    function clearChart(note) {
      const svg = document.getElementById("chart-svg");
      const xBox = document.getElementById("chart-x");
      const yBox = document.getElementById("chart-y");
      const wrap = document.getElementById("chart-wrap");
      if (svg) svg.innerHTML = "";
      if (xBox) xBox.innerHTML = "";
      if (yBox) yBox.innerHTML = "";
      hidePop();
      if (!wrap) return;
      let el = wrap.querySelector(".chart-note");
      if (!note) {
        if (el) el.remove();
        return;
      }
      if (!el) {
        el = document.createElement("p");
        el.className = "chart-note";
        wrap.appendChild(el);
      }
      el.textContent = note;
    }

    function paintChart() {
      const t = activeTrade();
      const token = ++chartToken;
      hidePop();
      paintRange();
      if (!t) {
        clearChart("Select a print on the tape.");
        return;
      }
      const code = String(t.ticker || "").toUpperCase();
      if (!QC.isChartTicker(code) || typeof drawChart !== "function" || typeof slicePriceRange !== "function") {
        clearChart(code && code !== "—" ? "No daily prices on file for " + code + "." : "This print has no charted ticker.");
        return;
      }
      loadPrices(code).then((points) => {
        if (token !== chartToken) return;
        if (!points || points.length < 2) {
          clearChart("No daily prices on file for " + code + ".");
          return;
        }
        clearChart("");
        const tradeIso = t.trade_date || "";
        const useRange = pickRangeForTrade(points, tradeIso, chartRange);
        if (useRange !== chartRange) {
          chartRange = useRange;
          paintRange();
        }
        const slice = slicePriceRange(points, chartRange);
        const marks = [{
          date: tradeIso,
          side: t.side,
          filer: QC.titleCaseName(t.filer),
          amount: t.amount,
          shares: t.shares,
          price: t.price,
          value: t.value
        }];
        const hits = drawChart(slice, marks, {
          range: chartRange,
          theme: "cyan",
          onMark: showPop
        });
        requestAnimationFrame(() => {
          if (token !== chartToken) return;
          const hit = (hits || []).find((h) => h.date === tradeIso) || (hits && hits[0]);
          if (hit) showPop(hit);
        });
      });
    }

    function selectDesk(id) {
      if (!id) return;
      const next = deskRows.find((t) => t.id === id);
      if (!next) return;
      const prev = activeTrade();
      const tickerChanged = prev && prev.ticker !== next.ticker;
      activeId = id;
      if (tickerChanged) chartRange = "3m";
      markActiveRow();
      paintFocus();
      if (DESK_MQ.matches) paintChart();
    }

    function bindDesk() {
      const list = document.getElementById("rows");
      const rangeBox = document.getElementById("range");
      if (list && !list.dataset.bound) {
        list.dataset.bound = "1";
        list.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          if (!DESK_MQ.matches) return;
          const row = e.target.closest("li.qc-txn-tape[data-id]");
          if (row) selectDesk(row.getAttribute("data-id"));
        });
      }
      if (rangeBox && !rangeBox.dataset.bound) {
        rangeBox.dataset.bound = "1";
        rangeBox.addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-r]");
          if (!btn) return;
          chartRange = btn.getAttribute("data-r");
          paintChart();
        });
      }
      if (!bindDesk._resize) {
        bindDesk._resize = true;
        DESK_MQ.addEventListener("change", () => {
          paint(all, collected);
        });
        window.addEventListener("resize", () => {
          if (!DESK_MQ.matches || !activeTrade()) return;
          clearTimeout(bindDesk._fit);
          bindDesk._fit = setTimeout(paintChart, 100);
        });
      }
    }

    async function run() {
      bindDesk();
      const data = await fetch("insider-trades-lite.json").then((r) => r.json());
      all = data.trades || [];
      collected = data.collected || "";
      paint(all, collected);
    }
    document.getElementById("windows").addEventListener("click", (e) => {
      const w = e.target.closest("button[data-w]");
      const s = e.target.closest("button[data-side]");
      if (w) days = Number(w.dataset.w);
      if (s) side = side === s.dataset.side ? "" : s.dataset.side;
      const p = new URLSearchParams();
      p.set("w", String(days));
      if (side) p.set("side", side);
      history.replaceState(null, "", location.pathname + "?" + p.toString());
      paint(all, collected);
    });
    document.getElementById("q").addEventListener("input", (e) => {
      q = e.target.value;
      paint(all, collected);
    });
    run().catch(() => {
      document.getElementById("rows").innerHTML = "<li class=\"muted\">Could not load insider tape.</li>";
    });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
  </script>
  <script src="refresh.js"></script>
  <nav class="tabbar" aria-label="Insider tape">
    <a href="insiders.html" class="on" aria-current="page" title="Officer trade tape">Tape</a>
    <a href="insider-landed.html" title="New insider filings">Filed</a>
    <a href="insider-signals.html" title="Insider buy heat">Heat</a>
    <a href="insider-board.html" title="Officer leaderboard">Leaders</a>
    <a href="insider-checks.html" title="Price-file hygiene">Checks</a>
  </nav>
</body>
