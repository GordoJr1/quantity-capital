# GitHub-managed pages-build-deployment does not retry a 400 from
# actions/deploy-pages when a previous SHA is still "in progress"
# (insider tape deploy can hold that lock through the politician push).
# Rebuild HEAD once per SHA so daily tape publishes still go live.
name: pages-retry
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
concurrency:
  group: pages-retry
  cancel-in-progress: false
jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      deployments: write
      pages: write
    steps:
      - name: Rebuild Pages once per SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          fails=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=20" \
            --jq '[.workflow_runs[] | select(.name=="pages build and deployment" and .conclusion=="failure")] | length')
          echo "failed pages-build-deployment runs for ${SHA:0:7}: $fails"
          if [ "${fails:-0}" -ge 3 ]; then
            echo "already retried this SHA; not looping"
            exit 0
          fi
          echo "waiting for previous Pages deploy lock to drop"
          sleep 90
          if gh api -X POST "repos/$REPO/pages/builds"; then
            echo "requested Pages rebuild of HEAD"
            exit 0
          fi
          echo "pages/builds POST failed; rerunning deploy job"
          gh run rerun "$FAILED_RUN" --failed -R "$REPO"
