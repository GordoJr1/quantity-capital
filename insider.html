<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1d26" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Quantity" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />
  <title>Insider — Quantity Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --steel: #1c2430; --panel: #2a3340; --paper: #d8dde3; --white: #eef2f5;
      --caution: #e3b41a; --mute: #8b96a3; --ink: #1a1d26; --teal: #36999d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--ink); color-scheme: dark; scrollbar-gutter: stable; overflow-y: scroll; }
    body {
      font-family: "IBM Plex Sans", sans-serif; color: var(--white);
      background: linear-gradient(180deg, rgba(26, 29, 38, 0.94), rgba(28, 36, 48, 0.97)), url("city.jpg?v=15") 50% 30% / cover fixed;
      min-height: 100vh;
    }
    .wrap { width: min(1680px, calc(100% - 48px)); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 2px solid var(--teal); }
    .mark, h1, .kicker, nav, .tk, .back {
      font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
    }
    a.mark { font-weight: 700; letter-spacing: 0.18em; font-size: 1rem; color: inherit; text-decoration: none; }
    .mark span { color: var(--teal); }
    nav { display: flex; gap: 14px; font-size: 0.88rem; letter-spacing: 0.1em; flex-wrap: wrap; }
    nav a { color: var(--paper); text-decoration: none; }
    nav a:hover, nav a.on { color: var(--caution); }
    .back { color: var(--teal); text-decoration: none; display: inline-block; margin: 18px 0 8px; }
    .kicker { color: var(--caution); margin: 8px 0; }
    h1 { font-size: clamp(2.2rem, 8vw, 3.8rem); line-height: 0.9; margin-bottom: 8px; }
    .muted { color: var(--mute); font-size: 0.88rem; margin-bottom: 16px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 0 22px; border: 1px solid #4a5563; background: var(--panel); }
    .stat { padding: 12px 14px; border-right: 1px solid #3a4452; }
    .stat:last-child { border-right: 0; }
    .stat b { display: block; font-family: "Barlow Condensed", sans-serif; font-size: 1.6rem; color: var(--caution); }
    .stat span { color: var(--mute); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .section-kicker { color: var(--caution); margin: 8px 0 10px; font-size: 0.9rem; }
    .table-wrap { overflow-x: auto; margin: 0 0 28px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 760px; }
    th {
      text-align: left; color: var(--mute); font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.75rem; font-weight: 600;
      padding: 8px 8px 8px 0; border-bottom: 1px solid #4a5563; white-space: nowrap;
    }
    td { padding: 10px 8px 10px 0; border-bottom: 1px solid #2c3440; vertical-align: top; }
    td.num, th.num { text-align: right; }
    .tk { color: inherit; text-decoration: none; font-weight: 600; }
    .tk:hover { color: var(--caution); }
    .co { display: block; color: var(--mute); font-size: 0.78rem; margin-top: 2px; }
    .buy { color: #7dcf7a; font-weight: 600; }
    .sell { color: #ef7a74; font-weight: 600; }
    .award { color: var(--caution); font-weight: 600; }
    .amt { color: var(--caution); font-weight: 600; white-space: nowrap; }
    footer { border-top: 2px solid var(--caution); margin-top: 28px; }
    footer .wrap { display: flex; justify-content: space-between; padding: 18px 0 36px; font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); }
    footer a { color: var(--caution); }
    .tabbar { display: none; }
    @media (display-mode: standalone) {
      body { padding-top: env(safe-area-inset-top, 0px); }
    }
    @media (max-width: 820px) {
      .wrap { width: calc(100% - 24px); }
      header nav { display: none; }
      .tabbar {
        display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
        background: var(--ink); border-top: 2px solid var(--teal); padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .tabbar a {
        flex: 1 1 0; min-height: 44px; display: flex; align-items: center; justify-content: center;
        font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
        font-size: 0.78rem; color: var(--paper); text-decoration: none; text-align: center; padding: 0 2px;
      }
      .tabbar a.on { color: var(--caution); }
      body { padding-bottom: calc(44px + env(safe-area-inset-bottom, 0px) + 8px); }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat:nth-child(2) { border-right: 0; }
      .stat:nth-child(3) { border-top: 1px solid #3a4452; }
      .table-wrap { overflow: visible; }
      table { min-width: 0; display: block; }
      thead { display: none; }
      tbody { display: grid; gap: 10px; }
      tbody tr {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "stock side"
          "date total"
          "shares after"
          "price held";
        gap: 4px 12px;
        padding: 12px;
        border: 1px solid #3a4452;
        background: rgba(42, 51, 64, 0.72);
      }
      tbody td { min-width: 0; padding: 0; border: 0; font-size: 0.88rem; }
      tbody td.stock { grid-area: stock; }
      tbody td.side { grid-area: side; align-self: start; text-align: right; }
      tbody td.date { grid-area: date; color: var(--mute); font-size: 0.78rem; }
      tbody td.shares { grid-area: shares; }
      tbody td.price { grid-area: price; color: var(--mute); font-size: 0.78rem; }
      tbody td.total { grid-area: total; text-align: right; }
      tbody td.after { grid-area: after; text-align: right; color: var(--mute); font-size: 0.78rem; }
      tbody td.after::before { content: "After "; }
      tbody td.held { grid-area: held; text-align: right; color: var(--mute); font-size: 0.78rem; }
      tbody td.held::before { content: "% held "; }
      tbody tr > td.muted { grid-column: 1 / -1; }
    }
      .sub-bar {
      padding: 8px 0 2px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .asof {
      color: var(--mute);
      font-size: 0.82rem;
      margin: 0 0 0 auto;
      font-family: "IBM Plex Sans", sans-serif;
    }
  </style>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <a class="qc-skip" href="#main">Skip to content</a>
  <header class="qc-header">
    <div class="wrap qc-header-inner">
      <a class="mark" href="index.html">Quantity <span>Capital</span></a>
      <nav class="qc-nav" aria-label="Insider tape">
        <a href="insiders.html" title="Officer trade tape">Tape</a>
        <a href="insider-landed.html" title="New insider filings">Filed</a>
        <a href="insider-signals.html" title="Insider buy heat">Heat</a>
        <a href="insider-board.html" title="Officer leaderboard">Leaders</a>
        <a href="insider-checks.html" title="Price-file hygiene">Checks</a>
      </nav>
      <a class="qc-mode" href="index.html" title="Politician STOCK Act tape">Politicians</a>
    </div>
  </header>
  <div class="wrap" id="main">
    <div class="sub-bar">
      <a class="back" href="insiders.html">← Insiders</a>
      <p class="asof" id="asof"></p>
    </div>
    <p class="kicker" id="kicker">Officer</p>
    <h1 id="who">—</h1>
    <p class="muted" id="title"></p>
    <div class="stats" id="stats"></div>
    <p class="kicker section-kicker">Trades</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Stock</th>
            <th>Tx</th>
            <th>Date</th>
            <th class="num">Shares</th>
            <th class="num">@Price</th>
            <th class="num">Total</th>
            <th class="num">After</th>
            <th class="num">%Held After</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </div>
  <footer>
    <div class="wrap"><span>© Quantity Capital</span><a href="mailto:gordojr@proton.me">Transmit</a></div>
  </footer>
  <script src="qc.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id") || "";
    if (!id) location.replace("insiders.html");
    function fmtShares(n) {
      if (n == null || n === "") return "—";
      return Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
    }
    function fmtPx(n) {
      if (n == null || n === "" || Number(n) === 0) return "—";
      const x = Number(n);
      if (!isFinite(x)) return "—";
      return "$" + x.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
    }
    function fmtPct(n) {
      return QC.formatHeldPct(n);
    }
    fetch("insider-trades-lite.json").then((r) => r.json()).then((data) => {
      const asof = document.getElementById("asof");
      if (asof) asof.textContent = QC.asOfLabel(data.collected);
      const rows = (data.trades || []).filter((t) => t.filer_id === id)
        .sort((a, b) => (b.trade_date || "").localeCompare(a.trade_date || ""));
      if (!rows.length) {
        document.getElementById("who").textContent = "Not on tape";
        return;
      }
      const name = rows[0].filer;
      document.getElementById("who").textContent = name;
      document.title = name + " — Insiders — Quantity Capital";
      document.getElementById("title").textContent = rows[0].title || "";
      const buys = rows.filter((t) => t.side === "purchase");
      const val = buys.reduce((s, t) => s + (Number(t.value) || 0), 0);
      document.getElementById("stats").innerHTML =
        "<div class=\"stat\"><b>" + rows.length + "</b><span>prints</span></div>" +
        "<div class=\"stat\"><b>" + buys.length + "</b><span>buys</span></div>" +
        "<div class=\"stat\"><b>" + (val ? QC.formatMoney(val) : "—") + "</b><span>buy value</span></div>";
      document.getElementById("list").innerHTML = rows.map((t) => {
        const cls = QC.txnClass(t);
        const href = "insider-ticker.html?t=" + encodeURIComponent(t.ticker || "") + "&id=" + encodeURIComponent(id);
        const tk = QC.isChartTicker(t.ticker)
          ? "<a class=\"tk\" href=\"" + href + "\">" + QC.esc(t.ticker) + "</a>"
          : QC.esc(t.ticker || "—");
        return "<tr>" +
          "<td class=\"stock\">" + tk +
            (t.company ? "<span class=\"co\">" + QC.esc(t.company) + "</span>" : "") + "</td>" +
          "<td class=\"side " + cls + "\">" + QC.esc(QC.txnLabel(t)) + "</td>" +
          "<td class=\"date\">" + QC.esc(QC.prettyDate(t.trade_date)) + "</td>" +
          "<td class=\"num shares\">" + fmtShares(t.shares) + "</td>" +
          "<td class=\"num price\">" + fmtPx(t.price) + "</td>" +
          "<td class=\"num amt total\">" + QC.esc(QC.formatAmountRange(t.amount) || "—") + "</td>" +
          "<td class=\"num after\">" + fmtShares(t.shares_after) + "</td>" +
          "<td class=\"num held\">" + fmtPct(t.held_pct) + "</td></tr>";
      }).join("");
    }).catch(() => { document.getElementById("who").textContent = "Could not load"; });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
  <script src="refresh.js"></script>
  <nav class="tabbar" aria-label="Insider tape">
    <a href="insiders.html" title="Officer trade tape">Tape</a>
    <a href="insider-landed.html" title="New insider filings">Filed</a>
    <a href="insider-signals.html" title="Insider buy heat">Heat</a>
    <a href="insider-board.html" title="Officer leaderboard">Leaders</a>
    <a href="insider-checks.html" title="Price-file hygiene">Checks</a>
  </nav>
</body>
</html>
