<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1d26" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Quantity" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />
  <link rel="preload" href="trades-lite.json" as="fetch">
  <title>Quantity Capital</title>
  <meta name="description" content="Official Senate, House, and White House STOCK Act / OGE 278-T tape. Amounts are ranges, not share counts." />
  <meta property="og:title" content="Quantity Capital" />
  <meta property="og:description" content="Official Senate, House, and White House STOCK Act / OGE 278-T tape." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --steel: #1c2430;
      --panel: #2a3340;
      --paper: #d8dde3;
      --white: #eef2f5;
      --fed: #1e4b8a;
      --red: #c2302a;
      --caution: #e3b41a;
      --mute: #8b96a3;
      --ink: #1a1d26;
      --teal: #36999d;
      --navy: #1c2d4e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      background: var(--ink);
      color-scheme: dark;
    }

    body {
      font-family: "IBM Plex Sans", sans-serif;
      color: var(--white);
      background:
        linear-gradient(180deg, rgba(26, 29, 38, 0.94), rgba(28, 36, 48, 0.97)),
        url("city.jpg?v=15") 50% 30% / cover fixed;
      min-height: 100vh;
    }

    .bay-left, .bay-right { display: none; }

    .bay-left::after, .bay-right::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(28, 36, 48, 0.9);
    }

    .bay-left {
      left: 0;
      background-size: 780% auto;
      background-position: 6% 42%;
      mask-image: linear-gradient(to right, #000 40%, transparent);
    }

    .bay-right {
      right: 0;
      background-size: 520% auto;
      background-position: 96% 52%;
      mask-image: linear-gradient(to left, #000 45%, transparent);
    }

    .stripe {
      height: 10px;
      background: repeating-linear-gradient(
        -45deg,
        var(--ink) 0 10px,
        var(--teal) 10px 20px
      );
    }

    .wrap { width: min(1680px, calc(100% - 48px)); margin: 0 auto; position: relative; z-index: 1; }

    .landed-chip-row {
      background: var(--ink);
      padding: 10px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .asof {
      color: var(--mute);
      font-size: 0.82rem;
      margin: 0;
      font-family: "IBM Plex Sans", sans-serif;
    }
    .landed-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.9rem;
      color: var(--caution);
      background: rgba(227, 180, 26, 0.08);
      border: 1px solid var(--caution);
      padding: 8px 14px;
      min-height: 44px;
      text-decoration: none;
      white-space: nowrap;
    }
    .landed-chip:hover { background: rgba(227, 180, 26, 0.16); color: var(--caution); }
    .landed-chip .n { font-weight: 700; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 2px solid var(--teal);
    }

    .mark {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 1rem;
    }

    .mark span { color: var(--teal); }

    nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    a.mark { color: inherit; text-decoration: none; }
    nav a { color: var(--paper); text-decoration: none; }
    nav a:hover, nav a.on { color: var(--caution); }

    .kicker {
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--caution);
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    h1 {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: clamp(3.6rem, 9vw, 7rem);
      line-height: 0.85;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 em {
      font-style: normal;
      color: var(--red);
    }

    .tag {
      margin-top: 16px;
      max-width: 40ch;
      color: var(--paper);
      line-height: 1.55;
    }

    .meta {
      margin-top: 12px;
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--caution);
      font-size: 0.88rem;
    }

    .cta { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }

    .btn {
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 10px 16px;
      border: 2px solid var(--caution);
      color: var(--caution);
    }

    .btn.fill { background: var(--caution); color: #1a1404; }
    .btn.red { border-color: var(--red); color: var(--white); background: var(--red); }
    .btn:hover { opacity: 0.88; }

    section { padding: 32px 0 64px; }
    #tape { padding-top: 16px; }

    h2 {
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--caution);
      margin-bottom: 14px;
      font-size: 1.1rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid #4a5563;
      border-left: 6px solid var(--fed);
      padding: 22px;
    }

    .card h3 {
      font-family: "Barlow Condensed", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .card p, .card li { color: var(--paper); line-height: 1.55; }
    .feed-empty { padding: 28px 16px; color: var(--mute); }

    .sample-flag {
      display: inline-block;
      margin-bottom: 10px;
      padding: 3px 8px;
      border: 1px solid var(--red);
      color: var(--red);
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .tape {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tape-item {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      gap: 14px;
      align-items: center;
      background: var(--panel);
      border: 1px solid #4a5563;
      padding: 14px 16px;
      text-decoration: none;
      color: inherit;
    }

    .tape-item:hover { border-color: var(--caution); }

    .pill {
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.85rem;
      text-align: center;
      padding: 6px 8px;
      border: 1px solid currentColor;
    }

    .pill.buy { color: #7dcf7a; }
    .pill.sell { color: #ef7a74; }

    .tape-item h3 {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .tape-item p { color: var(--mute); font-size: 0.9rem; }
    .tape-item .amt {
      font-family: "Barlow Condensed", sans-serif;
      color: var(--caution);
      letter-spacing: 0.04em;
      text-align: right;
    }

    .picker {
      position: relative;
      max-width: 420px;
      margin: 0 0 18px;
    }

    .picker label {
      display: block;
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--caution);
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .picker input {
      width: 100%;
      background: #151b24;
      border: 1px solid #4a5563;
      color: var(--white);
      padding: 10px 12px;
      font: inherit;
    }

    .picker input:focus { outline: 1px solid var(--caution); }

    .picker-menu {
      position: absolute;
      left: 0; right: 0; top: 100%;
      background: #151b24;
      border: 1px solid #4a5563;
      max-height: 220px;
      overflow: auto;
      z-index: 12;
      display: none;
    }

    .picker-menu.open { display: block; }

    .picker-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid #2c3440;
      color: var(--paper);
      padding: 10px 12px;
      cursor: pointer;
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .picker-menu button:hover { background: rgba(227, 180, 26, 0.12); color: var(--caution); }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin: 0 0 16px;
    }
    .filters label {
      display: block;
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--caution);
      margin-bottom: 6px;
      font-size: 0.85rem;
    }

    .filters input, .filters select {
      width: 100%;
      background: #151b24;
      border: 1px solid #4a5563;
      color: var(--white);
      padding: 10px 12px;
      font: inherit;
    }

    .table-wrap { overflow: visible; }

    table.tape-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--panel);
    }

    table.tape-table th, table.tape-table td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #3a4452;
      vertical-align: top;
    }

    table.tape-table td:nth-child(1),
    table.tape-table td:nth-child(2),
    table.tape-table td:nth-child(4),
    table.tape-table td:nth-child(5),
    table.tape-table td:nth-child(8),
    table.tape-table td:nth-child(9) {
      white-space: nowrap;
    }

    table.tape-table th {
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--caution);
      font-weight: 600;
      position: sticky;
      top: var(--tape-lock-h, 0px);
      z-index: 14;
      background: var(--panel);
      box-shadow: 0 1px 0 #3a4452;
    }

    .tix-meta, .tix-stamp { display: none; }

    table.tape-table a { color: inherit; text-decoration: none; }
    table.tape-table a:hover { color: var(--caution); }
    .buy { color: #7dcf7a; }
    .sell { color: #ef7a74; }
    .opt-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border: 1px solid #6b7582;
      color: #c5cdd6;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      vertical-align: middle;
    }
    .co { display: block; color: var(--paper); }
    .ind { color: var(--mute); font-size: 0.88rem; }
    .filing-err {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border: 1px solid var(--red);
      color: var(--red);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      vertical-align: middle;
      white-space: nowrap;
    }
    .landed-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border: 1px solid var(--caution);
      color: var(--caution);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      vertical-align: middle;
      white-space: nowrap;
    }
    table.tape-table tr.has-err td:nth-child(2) { box-shadow: inset 3px 0 0 var(--red); }
    table.tape-table tr.just-in td:first-child { box-shadow: inset 3px 0 0 var(--caution); }
    .check-landed {
      display: flex;
      align-items: flex-end;
    }
    .check-landed label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin: 0;
      height: 42px;
    }
    .check-landed input { width: auto; accent-color: var(--caution); }
    .count { color: var(--mute); font-size: 0.85rem; margin: 0; padding: 0 0 10px; }
    .more-row { margin: 14px 0 0; }

    table.hist {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    table.hist th, table.hist td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid #3a4452;
    }

    table.hist th {
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--caution);
      font-weight: 600;
    }

    footer {
      position: relative;
      z-index: 1;
      border-top: 2px solid var(--caution);
      background:
        linear-gradient(0deg, rgba(16, 20, 28, 0.9), rgba(16, 20, 28, 0.86)),
        url("city.jpg?v=15") 50% 96% / cover no-repeat;
    }

    footer .wrap {
      display: flex;
      justify-content: space-between;
      padding: 18px 0 36px;
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mute);
    }

    footer a { color: var(--caution); }

    .filter-fold > summary {
      display: none;
    }

    @media (max-width: 820px), (orientation: landscape) and (max-height: 620px) {
      .tape-scroll {
        position: relative;
        z-index: 1;
      }
      #tape { padding-top: 8px; }
      .filter-fold {
        border: 1px solid #4a5563;
        background: #151b24;
        margin: 0 0 8px;
      }
      .filter-fold > summary {
        display: block;
        padding: 12px 14px;
        font-family: "Barlow Condensed", sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--caution);
        cursor: pointer;
        list-style: none;
        min-height: 44px;
      }
      .filter-fold > summary::-webkit-details-marker { display: none; }
      .filter-fold > summary::before { content: "▸ "; }
      .filter-fold[open] > summary::before { content: "▾ "; }
      .filter-fold[open] > summary { border-bottom: 1px solid #3a4452; }
      .filter-fold .picker, .filter-fold .filters { padding: 10px 12px 12px; }
    }



    @media (max-width: 820px) {
      .wrap { width: calc(100% - 24px); }
      nav { gap: 12px; font-size: 0.85rem; }
      section { padding: 16px 0 40px; }
      .picker { max-width: none; margin-bottom: 12px; }
      .filters { grid-template-columns: 1fr 1fr; }
      .bay-left, .bay-right { display: none; }
      footer .wrap { flex-direction: column; gap: 8px; padding-bottom: 28px; }
      .filters input, .filters select, .picker input {
        font-size: 16px;
        min-height: 44px;
      }
      .btn { display: inline-block; min-height: 44px; padding: 12px 16px; }
      table.tape-table thead { display: none; }
      table.tape-table, table.tape-table tbody { display: block; width: 100%; }
      table.tape-table tr {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr) 6.25em;
        grid-template-areas:
          "stamp who side"
          "stamp ticker amt"
          "stamp meta meta";
        gap: 3px 10px;
        margin: 0 0 8px;
        border: 1px solid #4a5563;
        background: var(--panel);
        padding: 10px 12px;
      }
      table.tape-table td {
        display: block;
        padding: 0;
        border: 0;
        white-space: normal;
      }
      table.tape-table td::before { content: none; }
      table.tape-table .desk-only { display: none; }
      table.tape-table .tix-stamp {
        display: flex;
        grid-area: stamp;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-right: 1px solid #3a4452;
        padding-right: 8px;
        text-align: center;
        font-family: "Barlow Condensed", sans-serif;
      }
      table.tape-table .tix-stamp .mon {
        color: var(--caution);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }
      table.tape-table .tix-stamp .day {
        font-size: 1.55rem;
        line-height: 1;
        font-weight: 700;
      }
      table.tape-table .tix-stamp .yr { color: var(--mute); font-size: 0.72rem; }
      table.tape-table .tix-stamp .filing-err { margin: 5px 0 0; margin-left: 0; }
      table.tape-table tr.has-err { box-shadow: inset 3px 0 0 var(--red); }
      table.tape-table .tix-who {
        grid-area: who;
        font-family: "Barlow Condensed", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 1.05rem;
      }
      table.tape-table .tix-who a { color: var(--white); }
      table.tape-table .tix-side {
        grid-area: side;
        text-align: left;
        padding-top: 2px;
      }
      table.tape-table .tix-tk { grid-area: ticker; font-weight: 600; }
      table.tape-table .tix-amt {
        grid-area: amt;
        text-align: left;
        color: var(--caution);
        font-family: "Barlow Condensed", sans-serif;
        font-size: 1.05rem;
      }
      table.tape-table .tix-meta {
        display: block;
        grid-area: meta;
        color: var(--mute);
        font-size: 0.8rem;
        line-height: 1.35;
      }
      table.tape-table th { position: static; }
      table.tape-table tr { position: relative; z-index: 0; }
      .table-wrap { overflow: visible; position: relative; z-index: 0; }
    }
    @media (max-width: 520px) {
      .filters { grid-template-columns: 1fr; }
    }
    @media (display-mode: standalone) {
      body { padding-top: env(safe-area-inset-top, 0px); }
    }

    #board { padding: 16px 0 8px; }
    #tape .filter-fold { margin: 0 0 12px; }
    .board-tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      margin: 0 0 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .board-tabs::-webkit-scrollbar { display: none; }
    .board-tabs button {
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid #4a5563;
      color: var(--mute);
      padding: 8px 4px;
      min-height: 44px;
      flex: 1 1 0;
      min-width: 0;
      font-size: 0.72rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .board-tabs button.on {
      border-color: var(--caution);
      color: var(--caution);
    }
    .board-note { color: var(--mute); font-size: 0.82rem; margin: 0 0 12px; line-height: 1.4; }
    .board-list { list-style: none; border: 1px solid #4a5563; background: var(--panel); }
    @media (min-width: 821px) {
      #board .board-list, #tape .table-wrap { max-width: 1040px; }
    }
    footer[hidden], .stripe[hidden] { display: none !important; }
    #board-list { min-height: 70vh; }
    body.is-ready #board-list { min-height: 0; }
    .board-list li.skel {
      min-height: 52px;
      pointer-events: none;
    }
    .board-list li.skel::before,
    .board-list li.skel::after {
      content: "";
      display: block;
      background: #3a4452;
      border-radius: 2px;
    }
    .board-list li.skel::before {
      height: 14px;
      grid-column: 1 / -1;
    }
    .board-list li.skel::after {
      height: 10px;
      width: 55%;
      grid-column: 1 / -1;
    }
    .board-list li {
      display: grid;
      grid-template-columns: 2.2em minmax(0, 1fr) auto;
      gap: 8px 12px;
      align-items: baseline;
      padding: 9px 12px;
      border-bottom: 1px solid #3a4452;
    }
    .board-list li:last-child { border-bottom: 0; }
    .board-list li.board-trader {
      grid-template-areas: "rank name val";
      cursor: pointer;
    }
    .board-list li.board-trader .board-rank { grid-area: rank; }
    .board-list li.board-trader .board-who { grid-area: name; }
    .board-list li.board-trader .board-val { grid-area: val; }
    .board-list li.board-trader.open {
      grid-template-areas:
        "rank name val"
        "sec sec sec";
      background: rgba(227, 180, 26, 0.05);
    }
    .board-sectors {
      grid-area: sec;
      list-style: none;
      margin: 4px 0 2px;
      padding: 6px 0 0;
      border-top: 1px solid #3a4452;
      display: none;
    }
    .board-list li.board-trader.open .board-sectors { display: block; }
    .board-sectors li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: baseline;
      padding: 5px 0 5px 2.2em;
      border: 0;

    }
    .board-sectors .sec-name { color: var(--paper); font-size: 0.88rem; }
    .board-flag {
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid var(--caution);
      color: var(--caution);
      font-family: "Barlow Condensed", sans-serif;

      letter-spacing: 0.08em;
      text-transform: uppercase;

    .board-val.down { color: #ef7a74; }
    .board-rank {
      font-family: "Barlow Condensed", sans-serif;

    .board-list li:first-child .board-rank { color: var(--caution); }
    .board-list a {
      color: var(--white);

    .board-list a:hover { color: var(--caution); }

    .board-val {
      font-family: "Barlow Condensed", sans-serif;
      color: var(--caution);
      font-size: 1.05rem;
      white-space: nowrap;
    }
    #board-more { margin-top: 12px; }
    .tk-link {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: #4a5563;
    }
    .tk-link:hover { color: var(--caution); }
    .board-list a.tk-link {
      color: var(--white);
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .chart-back {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 16, 0.72);
      z-index: 80;
    }
    .chart-panel {
      position: fixed;
      left: 50%;
      top: 6vh;
      transform: translateX(-50%);
      width: min(760px, calc(100% - 24px));
      max-height: 88vh;
      overflow: auto;
      background: #151b24;
      border: 1px solid #4a5563;
      z-index: 81;
      padding: 16px 18px 20px;
    }
    .chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .chart-close {
      background: transparent;
      border: 1px solid #4a5563;

      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;

    .chart-frame {
      display: grid;

      grid-template-rows: 220px 22px;
      background: #10151c;
      padding: 6px 8px 4px 0;

    #chart-svg { width: 100%; height: 220px; display: block; background: transparent; }
    .chart-y, .chart-x { color: var(--mute); font-size: 0.68rem; line-height: 1; }
    .chart-y {
      display: flex;
      flex-direction: column;

    .chart-legend { color: var(--mute); font-size: 0.78rem; margin: 8px 0 0; }
    .chart-legend .buy, .chart-legend .sell { margin-right: 12px; }

    @media (max-width: 820px) {

</head>

  <script src="qc.js"></script>
  <script>
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function uniqueFilers(trades) {
      const map = new Map();
      trades.forEach((t) => {
        if (!map.has(t.filer_id)) map.set(t.filer_id, t.filer);
      });
      return Array.from(map, ([id, name]) => ({ id, name })).sort((a, b) => a.name.localeCompare(b.name));
    }

    function bindPicker(filers) {
      const input = document.getElementById("who-search");
      const menu = document.getElementById("who-menu");
      if (!input || !menu) return;

      function show(list) {
        menu.innerHTML = list.map((p) =>
          '<button type="button" data-id="' + p.id + '">' + escapeHtml(p.name) + '</button>'
        ).join("");
        menu.classList.toggle("open", list.length > 0);
      }

      input.addEventListener("focus", () => show(filers));
      input.addEventListener("input", () => {
        const q = input.value.trim().toLowerCase();
        show(filers.filter((p) => p.name.toLowerCase().includes(q)));
      });
      menu.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        location.href = "politician.html?id=" + encodeURIComponent(btn.dataset.id);
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".picker")) menu.classList.remove("open");
      });
    }

    const isOptionLike = QC.isOptionLike;
    const optionMeta = QC.optionMeta;
    const optionTag = QC.optionTag;
    const assetKind = QC.assetKind;
    const enrich = QC.enrich;
    const isFilingError = QC.isFilingError;
    const OVERLAP_RULES = QC.OVERLAP_RULES;
    const issuerName = QC.issuerName;
    const overlapHit = QC.overlapHit;
    const SECTORS = QC.SECTORS;
    const sectorOf = QC.sectorOf;
    const amountHigh = QC.amountHigh;
    const isBond = QC.isBond;
    const formatMoney = QC.formatMoney;
    const signedMoney = QC.signedMoney;
    const prettyDate = QC.prettyDate;
    const sideLabel = QC.sideLabel;
    const isChartTicker = QC.isChartTicker;

    const PAGE = 120;
    let showAll = false;

    function errBadge() {
      return "<span class=\"filing-err\" title=\"Trade date is after the filed date on the official PTR.\">Filing error</span>";
    }

    function stampHtml(iso) {
      const d = new Date(String(iso || "") + "T00:00:00");
      if (isNaN(d.getTime())) {
        return "<td class=\"tix-stamp\"><span class=\"day\">—</span></td>";
      }
      const mon = d.toLocaleString("en-US", { month: "short" }).toUpperCase();
      const day = String(d.getDate()).padStart(2, "0");
      return "<td class=\"tix-stamp\"><span class=\"mon\">" + mon + "</span><span class=\"day\">" +
        day + "</span><span class=\"yr\">" + d.getFullYear() + "</span></td>";
    }

    function renderTape(rows) {
      const box = document.getElementById("tape-list");
      const count = document.getElementById("tape-count");
      const moreRow = document.getElementById("more-row");
      const moreBtn = document.getElementById("show-all");
      const visible = showAll ? rows : rows.slice(0, PAGE);
      count.textContent = visible.length === rows.length
        ? rows.length + " trades"
        : "Showing " + visible.length + " of " + rows.length + " trades";
      if (moreRow && moreBtn) {
        moreRow.hidden = rows.length <= PAGE;
        moreBtn.textContent = showAll ? "Show first 120" : "Show full list";
      }
      box.innerHTML = visible.map((t) => {
        const cls = t.side === "purchase" ? "buy" : t.side === "sale" ? "sell" : "";
        const bad = isFilingError(t);
        const fresh = QC.isLanded(t, 72);
        const flag = (bad ? errBadge() : "") +
          (fresh ? "<span class=\"landed-tag\" title=\"This print was added to Quantity Capital recently — the trade itself may be older.\">Landed</span>" : "");
        const meta = [t.company, t.industry || "—", t.owner].join(" · ");
        const trCls = (bad ? " has-err" : "") + (fresh ? " just-in" : "");
        return "<tr" + (trCls ? " class=\"" + trCls.trim() + "\"" : "") + ">" +
          stampHtml(t.trade_date).replace("</td>", flag + "</td>") +
          "<td class=\"desk-only\">" + escapeHtml(t.trade_date) + flag + "</td>" +
          "<td class=\"desk-only\">" + escapeHtml(t.filed_date) + "</td>" +
          "<td class=\"tix-who\"><a href=\"politician.html?id=" + encodeURIComponent(t.filer_id) + "\">" +
            escapeHtml(t.filer) + "</a></td>" +
          "<td class=\"tix-side " + cls + "\">" + escapeHtml(sideLabel(t.side)) + "</td>" +
          "<td class=\"tix-tk\">" + (isChartTicker(t.code)
            ? "<a class=\"tk-link\" href=\"ticker.html?t=" + encodeURIComponent(t.code) + "\">" + escapeHtml(t.code) + "</a>"
            : escapeHtml(t.code)) + optionTag(t) + "</td>" +
          "<td class=\"desk-only\"><span class=\"co\">" + escapeHtml(t.company) + "</span></td>" +
          "<td class=\"desk-only ind\">" + escapeHtml(t.industry || "—") + "</td>" +
          "<td class=\"tix-amt\">" + escapeHtml(QC.formatAmountRange(t.amount)) + "</td>" +
          "<td class=\"desk-only\">" + escapeHtml(t.owner) + "</td>" +
          "<td class=\"tix-meta\">" + escapeHtml(meta) + "</td>" +
          "</tr>";
      }).join("");
    }

    function nearestClose(points, date) {
      if (!points || !points.length) return null;
      let pick = points[0];
      for (let i = 0; i < points.length; i++) {
        if (points[i][0] <= date) pick = points[i];
        else break;
      }
      if (date < points[0][0]) return points[0];
      return pick;
    }

    function bookValue(rows) {
      const book = new Map();
      rows.slice().sort((a, b) => {
        const td = (a.trade_date || "").localeCompare(b.trade_date || "");
        return td !== 0 ? td : (a.filed_date || "").localeCompare(b.filed_date || "");
      }).forEach((t) => {
        if (t.side === "exchange" || isOptionLike(t)) return;
        const hi = amountHigh(t.amount);
        if (!hi) return;
        const key = isBond(t) ? "BONDS" : ((t.code && t.code !== "—") ? "T:" + t.code : "A:" + (t.asset || t.company || ""));
        const prev = book.get(key) || 0;
        if (t.side === "purchase") book.set(key, prev + hi);
        else if (t.side === "sale") book.set(key, prev - hi);
      });
      let total = 0;
      book.forEach((v) => { if (v > 0) total += v; });
      return total;
    }

    function findOverlaps(bio, rows) {
      const seats = [].concat((bio && bio.committees) || []).concat((bio && bio.subcommittees) || []);
      if (!seats.length) return [];
      const byCode = new Map();
      rows.filter((t) => t.side === "purchase" && !isBond(t) && !isOptionLike(t)).forEach((t) => {
        const code = t.code || "—";
        const industry = t.industry || "";
        seats.forEach((seat) => {
          OVERLAP_RULES.forEach((rule) => {
            if (!rule.seat.test(seat.name || "")) return;
            if (!overlapHit(rule, code, t.company || t.asset || "", industry)) return;
            const prev = byCode.get(code);
            if (!prev) {
              byCode.set(code, { code: code, why: rule.why });
              return;
            }
            if (prev.why.indexOf(rule.why) === -1) prev.why += "; " + rule.why;
          });
        });
      });
      return Array.from(byCode.values());
    }

    function tickerSector(list, code) {
      const hit = list.find((t) => (t.code || "").toUpperCase() === code);
      return sectorOf(hit && hit.industry) || "Industrials";
    }

    function traderSectors(list, overlaps, tickers) {
      const pnlBy = {};
      Object.keys(tickers || {}).forEach((code) => {
        const sec = tickerSector(list, code);
        pnlBy[sec] = (pnlBy[sec] || 0) + (tickers[code] || 0);
      });
      const conflictBy = {};
      (overlaps || []).forEach((o) => {
        const sec = tickerSector(list, String(o.code || "").toUpperCase());
        if (!conflictBy[sec]) conflictBy[sec] = [];
        String(o.why || "").split("; ").forEach((w) => {
          if (w && conflictBy[sec].indexOf(w) === -1) conflictBy[sec].push(w);
        });
      });
      const names = SECTORS.filter((s) => pnlBy[s] || conflictBy[s]);
      names.sort((a, b) => Math.abs(pnlBy[b] || 0) - Math.abs(pnlBy[a] || 0) || a.localeCompare(b));
      return names.map((name) => ({
        name: name,
        pnl: pnlBy[name] || 0,
        conflict: !!(conflictBy[name] && conflictBy[name].length),
        why: (conflictBy[name] || []).join(" · ")
      }));
    }

    function buildBoards(trades, bios, tradersFile) {
      const cutoff = new Date();
      cutoff.setFullYear(cutoff.getFullYear() - 3);
      const byId = new Map();
      trades.forEach((t) => {
        if (!t.filer_id || new Date(t.trade_date) < cutoff) return;
        if (!byId.has(t.filer_id)) byId.set(t.filer_id, []);
        byId.get(t.filer_id).push(t);
      });
      const people = (bios && bios.people) || {};
      const pnlPeople = (tradersFile && tradersFile.people) || {};
      const rows = [];
      byId.forEach((list, id) => {
        const overlaps = findOverlaps(people[id], list);
        const whys = [];
        overlaps.forEach((o) => {
          String(o.why || "").split("; ").forEach((w) => {
            if (w && whys.indexOf(w) === -1) whys.push(w);
          });
        });
        const rec = pnlPeople[id] || { pnl: 0, tickers: {} };
        rows.push({
          id: id,
          name: (people[id] && people[id].name) || list[0].filer,
          trades: list.length,
          conflicts: overlaps.length,
          whys: whys,
          pnl: rec.pnl || 0,
          sectors: traderSectors(list, overlaps, rec.tickers)
        });
      });
      const byTicker = new Map();
      trades.forEach((t) => {
        if (!t.filer_id || new Date(t.trade_date) < cutoff) return;
        if ((t.side !== "purchase" && t.side !== "sale") || isBond(t) || isOptionLike(t) || !isChartTicker(t.code)) return;
        const code = t.code.toUpperCase();
        const prev = byTicker.get(code) || { code: code, name: t.company || code, buys: 0, sells: 0, people: new Set() };
        if (t.side === "purchase") prev.buys += 1;
        else prev.sells += 1;
        prev.people.add(t.filer_id);
        if (t.company && t.company !== "—") prev.name = String(t.company).replace(/\s+-\s*$/, "");
        byTicker.set(code, prev);
      });
      const stocks = Array.from(byTicker.values()).map((s) => ({
        code: s.code,
        name: s.name,
        buys: s.buys,
        sells: s.sells,
        trades: s.buys + s.sells,
        people: s.people.size
      })).sort((a, b) => b.trades - a.trades || b.buys - a.buys || a.code.localeCompare(b.code));
      return {
        activity: rows.slice().sort((a, b) => b.trades - a.trades || a.name.localeCompare(b.name)),
        traders: rows.filter((r) => r.pnl !== 0 || (r.sectors && r.sectors.length)).sort((a, b) => b.pnl - a.pnl || a.name.localeCompare(b.name)),
        conflicts: rows.filter((r) => r.conflicts > 0).sort((a, b) => b.conflicts - a.conflicts || b.trades - a.trades),
        stocks: stocks
      };
    }

    function bindBoard(boards) {
      const list = document.getElementById("board-list");
      const note = document.getElementById("board-note");
      const more = document.getElementById("board-more");
      const tabs = document.querySelectorAll(".board-tabs button");
      if (!list) return;
      const state = { mode: "conflicts", limit: 10 };
      const notes = {
        conflicts: "",
        activity: "Disclosed trades in the last three years.",
        traders: "Theoretical P&L from the 3-year tape, high-end official ranges and daily closes. Not official. Tap a row — not the name — for sector performance.",
        stocks: "Most traded stock tickers in the last three years. Tap a ticker to see every buy and sell on the chart."
      };
      const paint = () => {
        const pool = boards[state.mode] || [];
        const rows = pool.slice(0, state.limit);
        note.textContent = notes[state.mode] || "";
        note.hidden = !note.textContent;
        more.hidden = pool.length <= 10;
        more.textContent = state.limit > 10 ? "Show top 10" : "Show top 30";
        tabs.forEach((btn) => btn.classList.toggle("on", btn.dataset.board === state.mode));
        list.innerHTML = rows.map((r, i) => {
          if (state.mode === "stocks") {
            return "<li><span class=\"board-rank\">" + String(i + 1).padStart(2, "0") + "</span>" +
              "<span><a class=\"tk-link\" href=\"ticker.html?t=" + encodeURIComponent(r.code) + "\">" +
              escapeHtml(r.code) + "</a><span class=\"board-why\">" + escapeHtml(r.name) +
              " · " + r.buys + " buys · " + r.sells + " sells</span></span>" +
              "<span class=\"board-val\">" + r.trades + (r.trades === 1 ? " trade" : " trades") + "</span></li>";
          }
          if (state.mode === "traders") {
            const cls = r.pnl > 0 ? "up" : r.pnl < 0 ? "down" : "";
            const secs = (r.sectors || []).map((s) => {
              const sc = s.pnl > 0 ? "up" : s.pnl < 0 ? "down" : "";
              const flag = s.conflict
                ? "<span class=\"board-flag\" title=\"" + escapeHtml(s.why || "Jurisdictional overlap") + "\">Conflict</span>"
                : "<span></span>";
              return "<li><span class=\"sec-name\">" + escapeHtml(s.name) + "</span>" + flag +
                "<span class=\"board-val " + sc + "\">" + signedMoney(s.pnl) + "</span></li>";
            }).join("");
            return "<li class=\"board-trader\" data-id=\"" + escapeHtml(r.id) + "\">" +
              "<span class=\"board-rank\">" + String(i + 1).padStart(2, "0") + "</span>" +
              "<span class=\"board-who\"><a href=\"politician.html?id=" + encodeURIComponent(r.id) + "\">" +
              escapeHtml(r.name) + "</a></span>" +
              "<span class=\"board-val " + cls + "\">" + signedMoney(r.pnl) + "</span>" +
              "<ul class=\"board-sectors\">" + (secs || "<li class=\"sec-name\">No priced stock trades.</li>") + "</ul></li>";
          }
          let val = r.conflicts + (r.conflicts === 1 ? " ticker" : " tickers");
          if (state.mode === "activity") val = r.trades + (r.trades === 1 ? " trade" : " trades");
          const why = (state.mode === "conflicts" && r.whys.length)
            ? "<span class=\"board-why\">" + escapeHtml(r.whys.join(" · ")) + "</span>"
            : "";
          return "<li><span class=\"board-rank\">" + String(i + 1).padStart(2, "0") + "</span>" +
            "<span><a href=\"politician.html?id=" + encodeURIComponent(r.id) + "\">" +
            escapeHtml(r.name) + "</a>" + why + "</span>" +
            "<span class=\"board-val\">" + escapeHtml(val) + "</span></li>";
        }).join("");
      };
      tabs.forEach((btn) => {
        btn.addEventListener("click", () => {
          state.mode = btn.dataset.board;
          state.limit = 10;
          paint();
        });
      });
      more.addEventListener("click", () => {
        state.limit = state.limit > 10 ? 10 : 30;
        paint();
      });
      list.addEventListener("click", (e) => {
        if (e.target.closest("a") || e.target.closest(".board-sectors")) return;
        const row = e.target.closest("li.board-trader");
        if (!row) return;
        row.classList.toggle("open");
      });
      paint();
    }

    function markTapeReady() {
      document.body.classList.add("is-ready");
      const foot = document.querySelector("footer");
      if (foot) foot.hidden = false;
      const stripe = document.querySelector(".stripe");
      if (stripe) stripe.hidden = false;
    }

    async function loadTape() {
      const box = document.getElementById("tape-list");
      if (!box) return;
      try {
        const res = await fetch("trades-lite.json");
        const data = await res.json();
        const chip = document.getElementById("landed-chip");
        const freshN = (data.trades || []).filter((t) => QC.isLanded(t, 72)).length;
        if (chip) {
          chip.innerHTML = freshN
            ? "Just landed \u00b7 <span class=\"n\">" + freshN + "</span>"
            : "Just landed";
        }
        const asof = document.getElementById("asof");
        if (asof && data.collected) {
          asof.textContent = "Tape as of " + QC.asOfLabel(data.collected);
        }
        let tickerFile = { tickers: {}, assets: {} };
        try {
          tickerFile = await (await fetch("tickers.json")).json();
        } catch (e) {}
        let bios = { people: {} };
        try {
          bios = await (await fetch("bios.json")).json();
        } catch (e) {}
        let tradersFile = { people: {} };
        try {
          tradersFile = await (await fetch("traders.json")).json();
        } catch (e) {}
        const rows = (data.trades || []).map((t) => enrich(t, tickerFile)).sort((a, b) => {
          const td = (b.trade_date || "").localeCompare(a.trade_date || "");
          return td !== 0 ? td : (b.filed_date || "").localeCompare(a.filed_date || "");
        });
        bindPicker(uniqueFilers(rows));

        function kindPool() {
          const kind = document.getElementById("filter-kind").value;
          if (kind === "stock") return rows.filter((t) => assetKind(t) === "stock");
          if (kind === "option") return rows.filter((t) => assetKind(t) === "option");
          if (kind === "bond") return rows.filter((t) => assetKind(t) === "bond");
          return rows;
        }

        function fillIndustries() {
          const sel = document.getElementById("filter-industry");
          const keep = sel.value;
          sel.innerHTML = '<option value="">All sectors</option>';
          SECTORS.forEach((name) => {
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = name;
            sel.appendChild(opt);
          });
          if (SECTORS.indexOf(keep) >= 0) sel.value = keep;
        }

        function writeFilters() {
          const p = new URLSearchParams();
          const kind = document.getElementById("filter-kind").value;
          const side = document.getElementById("filter-side").value;
          const chamber = document.getElementById("filter-chamber").value;
          const industry = document.getElementById("filter-industry").value;
          const company = document.getElementById("filter-company").value.trim();
          if (kind !== "stock") p.set("kind", kind);
          if (side) p.set("side", side);
          if (chamber) p.set("chamber", chamber);
          if (industry) p.set("industry", industry);
          if (company) p.set("q", company);
          if (document.getElementById("filter-landed").checked) p.set("landed", "1");
          const qs = p.toString();
          history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
        }

        function readFilters() {
          const p = new URLSearchParams(location.search);
          if (p.has("kind")) document.getElementById("filter-kind").value = p.get("kind");
          if (p.get("side")) document.getElementById("filter-side").value = p.get("side");
          if (p.get("chamber")) document.getElementById("filter-chamber").value = p.get("chamber");
          if (p.get("q")) document.getElementById("filter-company").value = p.get("q");
          if (p.get("industry")) document.getElementById("filter-industry").value = p.get("industry");
          if (p.get("landed") === "1") document.getElementById("filter-landed").checked = true;
        }

        function apply() {
          const companyQ = document.getElementById("filter-company").value.trim().toLowerCase();
          const industry = document.getElementById("filter-industry").value;
          const side = document.getElementById("filter-side").value;
          const chamber = document.getElementById("filter-chamber").value;
          const onlyLanded = document.getElementById("filter-landed").checked;
          const filtered = kindPool().filter((t) => {
            if (side && t.side !== side) return false;
            if (chamber && (t.chamber || "") !== chamber) return false;
            if (industry && sectorOf(t.industry) !== industry) return false;
            if (onlyLanded && !QC.isLanded(t, 72)) return false;
            if (companyQ) {
              const blob = (t.company + " " + t.code + " " + (t.asset || "")).toLowerCase();
              if (!blob.includes(companyQ)) return false;
            }
            return true;
          });
          if (onlyLanded) {
            filtered.sort((a, b) => String(b.added || "").localeCompare(String(a.added || "")));
          }
          writeFilters();
          renderTape(filtered);
        }

        document.getElementById("filter-company").addEventListener("input", () => { showAll = false; apply(); });
        document.getElementById("filter-industry").addEventListener("change", () => { showAll = false; apply(); });
        document.getElementById("filter-kind").addEventListener("change", () => {
          showAll = false;
          fillIndustries();
          apply();
        });
        document.getElementById("filter-side").addEventListener("change", () => { showAll = false; apply(); });
        document.getElementById("filter-chamber").addEventListener("change", () => { showAll = false; apply(); });
        document.getElementById("filter-landed").addEventListener("change", () => { showAll = false; apply(); });
        document.getElementById("show-all").addEventListener("click", () => {
          showAll = !showAll;
          apply();
        });
        fillIndustries();
        readFilters();
        fillIndustries();
        apply();
        bindBoard(buildBoards(rows, bios, tradersFile));
        markTapeReady();
      } catch (err) {
        bindPicker([]);
        markTapeReady();
        box.innerHTML = "<tr><td colspan=\"9\">Could not load trades.json. Open <a href=\"http://127.0.0.1:8765/#tape\">http://127.0.0.1:8765/</a> — double-clicking the HTML file will not load the list.</td></tr>";
      }
    }
    loadTape();

    (function pinTapeChrome() {
      const tape = document.getElementById("tape");
      const fold = document.querySelector(".filter-fold");
      const bar = document.querySelector("header");
      if (!tape) return;
      const sync = () => {
        const hh = bar ? bar.offsetHeight : 0;
        document.documentElement.style.setProperty("--site-header-h", hh + "px");
        document.documentElement.style.setProperty("--tape-lock-h", "0px");
        tape.style.setProperty("--tape-lock-h", "0px");
      };
      if (window.ResizeObserver && bar) new ResizeObserver(sync).observe(bar);
      const compact = window.matchMedia("(max-width: 820px), (orientation: landscape) and (max-height: 620px)");
      const syncFold = () => { if (fold) fold.open = !compact.matches; };
      compact.addEventListener("change", syncFold);
      syncFold();
      sync();
    })();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
