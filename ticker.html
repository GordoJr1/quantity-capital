<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1d26" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Quantity" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />
  <title>Quantity Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --steel: #1c2430;
      --panel: #2a3340;
      --paper: #d8dde3;
      --white: #eef2f5;
      --caution: #e3b41a;
      --mute: #8b96a3;
      --ink: #1a1d26;
      --teal: #36999d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--ink); color-scheme: dark; }
    body { font-family: "IBM Plex Sans", sans-serif; color: var(--white); background: var(--steel); }
    @media (display-mode: standalone) {
      body { padding-top: env(safe-area-inset-top, 0px); }
    }
    .stripe {
      height: 10px;
      background: repeating-linear-gradient(-45deg, var(--ink) 0 10px, var(--teal) 10px 20px);
    }
    .wrap { width: min(1680px, calc(100% - 48px)); margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0; border-bottom: 2px solid var(--teal);
    }
    .mark, h1, h2, .kicker, .back {
      font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .mark { font-weight: 700; letter-spacing: 0.18em; }
    .mark span { color: var(--teal); }
    .back { color: var(--teal); text-decoration: none; }
    .kicker { color: var(--caution); margin: 22px 0 8px; }
    h1 { font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 0.9; margin-bottom: 10px; }
    .muted { color: var(--mute); font-size: 0.88rem; line-height: 1.45; }
    #note { margin: 0 0 12px; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      margin: 0 0 14px;
      border: 1px solid #4a5563;
      background: var(--panel);
    }
    .stat { padding: 8px 10px; border-right: 1px solid #3a4452; }
    .stat:last-child { border-right: 0; }
    .stat b {
      display: inline;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.15rem;
      color: var(--caution);
      margin-right: 6px;
    }
    .stat b.up { color: #7dcf7a; }
    .stat b.down { color: #ef7a74; }
    .stat span { color: var(--mute); font-size: 0.75rem; }
    .up { color: #7dcf7a; }
    .down { color: #ef7a74; }
    .opt-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border: 1px solid #6b7582;
      color: #c5cdd6;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .buy { color: #7dcf7a; }
    .sell { color: #ef7a74; }
    .chart-frame {
      display: grid;
      grid-template-columns: 52px 1fr;
      grid-template-rows: minmax(260px, 42vh) 22px;
      background: #10151c;
      border: 1px solid #3a4452;
      padding: 6px 8px 4px 0;
    }
    #chart-svg { width: 100%; height: 100%; display: block; background: transparent; min-height: 260px; }
    .chart-y, .chart-x { color: var(--mute); font-size: 0.68rem; line-height: 1; }
    .chart-y {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      padding: 8px 6px 8px 4px;
    }
    .chart-x {
      grid-column: 2;
      display: flex;
      justify-content: space-between;
      padding: 6px 4px 0;
    }
    .chart-legend { color: var(--mute); font-size: 0.78rem; margin: 10px 0 0; }
    .chart-legend .buy, .chart-legend .sell { margin-right: 12px; }
    .chart-marks { list-style: none; margin: 16px 0 40px; }
    .chart-marks li {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) auto auto auto auto;
      gap: 10px;
      align-items: baseline;
      padding: 9px 0;
      border-bottom: 1px solid #2c3440;
      font-size: 0.9rem;
    }
    .chart-marks a { color: var(--white); text-decoration: none; }
    .chart-marks a:hover { color: var(--teal); }
    footer {
      border-top: 2px solid var(--teal); padding: 18px 0 36px;
      font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute);
    }
    @media (max-width: 820px) {
      .wrap { width: calc(100% - 24px); }
      header { padding: 12px 0; }
      .chart-frame { grid-template-rows: 240px 22px; }
      #chart-svg { min-height: 240px; }
      .chart-marks li {
        grid-template-columns: minmax(0, 1fr) 8.5em;
        grid-template-areas:
          "who side"
          "date amt"
          "px px";
      }
      .chart-marks .who { grid-area: who; }
      .chart-marks .side {
        grid-area: side;
        text-align: left;
      }
      .chart-marks .when { grid-area: date; color: var(--mute); }
      .chart-marks .amt { grid-area: amt; text-align: left; }
      .chart-marks .px { grid-area: px; color: var(--mute); font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="stripe"></div>
  <div class="wrap">
    <header>
      <div class="mark">Quantity <span>Capital</span></div>
      <a class="back" id="back" href="index.html">← Back</a>
    </header>
    <p class="kicker" id="kicker">Ticker</p>
    <h1 id="who">—</h1>
    <p class="muted" id="note" hidden></p>
    <div class="stats" id="stats"></div>
    <div class="chart-frame">
      <div class="chart-y" id="chart-y"></div>
      <svg id="chart-svg" viewBox="0 0 720 220" preserveAspectRatio="none"></svg>
      <div class="chart-x" id="chart-x"></div>
    </div>
    <p class="chart-legend"><span class="buy">● Buy</span><span class="sell">● Sell</span> Option purchase dates are marked; option P&amp;L is not.</p>
    <p class="kicker">Trades</p>
    <ul class="chart-marks" id="marks"></ul>
    <footer>Not investment advice · STOCK Act ranges, not share counts</footer>
  </div>
  <script src="qc.js"></script>
  <script src="chart.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const ticker = String(params.get("t") || "").toUpperCase();
    const filerId = params.get("id") || "";
    if (!ticker) location.replace("index.html");

    const esc = QC.esc;
    const amountHigh = QC.amountHigh;
    const isBond = QC.isBond;
    const isOptionLike = QC.isOptionLike;
    const optionMeta = QC.optionMeta;
    const optionTag = QC.optionTag;
    const formatMoney = QC.formatMoney;
    const signedMoney = QC.signedMoney;
    const prettyDate = QC.prettyDate;
    function nearestClose(points, date) {
      if (!points || !points.length) return null;
      let pick = points[0];
      for (let i = 0; i < points.length; i++) {
        if (points[i][0] <= date) pick = points[i];
        else break;
      }
      if (date < points[0][0]) return points[0];
      return pick;
    }
    function theoreticalPnl(trades, points) {
      const last = points[points.length - 1];
      const lots = [];
      let realized = 0;
      trades.slice().sort((a, b) => (a.trade_date || "").localeCompare(b.trade_date || "")).forEach((t) => {
        if (t.side !== "purchase" && t.side !== "sale") return;
        const pxRow = nearestClose(points, t.trade_date);
        const dollars = amountHigh(t.amount);
        if (!pxRow || !pxRow[1] || !dollars) return;
        const px = pxRow[1];
        let shares = dollars / px;
        if (t.side === "purchase") {
          lots.push({ shares: shares, px: px });
          return;
        }
        while (shares > 0 && lots.length) {
          const take = Math.min(shares, lots[0].shares);
          realized += (px - lots[0].px) * take;
          lots[0].shares -= take;
          shares -= take;
          if (lots[0].shares <= 0.0001) lots.shift();
        }
      });
      let remainShares = 0;
      let remainCost = 0;
      lots.forEach((lot) => {
        remainShares += lot.shares;
        remainCost += lot.shares * lot.px;
      });
      const market = remainShares * last[1];
      return { last: last, realized: realized, unrealized: market - remainCost, total: realized + (market - remainCost) };
    }

    document.getElementById("who").textContent = ticker;
    document.title = ticker + " — Quantity Capital";
    const back = document.getElementById("back");
    if (filerId) {
      back.href = "politician.html?id=" + encodeURIComponent(filerId);
      back.textContent = "← Politician";
    } else {
      back.href = "index.html";
      back.textContent = "← Tape";
    }

    const cutoff = new Date();
    cutoff.setFullYear(cutoff.getFullYear() - 3);

    Promise.all([
      fetch("trades.json").then((r) => r.json()),
      fetch("prices/" + encodeURIComponent(ticker) + ".json").then((r) => r.ok ? r.json() : null).catch(() => null),
      fetch("tickers.json").then((r) => r.json()).catch(() => ({ tickers: {}, assets: {} }))
    ]).then(([data, prices, tickerFile]) => {
      function tradeCode(t) {
        const extra = ((tickerFile && tickerFile.assets) || {})[t.asset] || {};
        const opt = optionMeta(t);
        return (t.ticker || extra.ticker || opt.under || "").toUpperCase();
      }
      const deals = (data.trades || []).filter((t) => {
        if ((t.side !== "purchase" && t.side !== "sale") || isBond(t)) return false;
        if (tradeCode(t) !== ticker) return false;
        if (new Date(t.trade_date) < cutoff) return false;
        if (filerId && t.filer_id !== filerId) return false;
        return true;
      }).sort((a, b) => (b.trade_date || "").localeCompare(a.trade_date || ""));
      const stockDeals = deals.filter((t) => !isOptionLike(t));
      const chartDeals = deals.filter((t) => !isOptionLike(t) || t.side === "purchase");

      const who = filerId && deals[0] ? deals[0].filer : "";
      if (who) {
        document.getElementById("kicker").textContent = who;
        document.title = ticker + " — " + who + " — Quantity Capital";
      }

      if (!prices || !prices.c || prices.c.length < 2) {
        const note = document.getElementById("note");
        note.hidden = false;
        note.textContent = prices && prices.missing
          ? "Yahoo has no daily series for " + ticker + "."
          : "No daily prices on file for " + ticker + ".";
        return;
      }
      const points = prices.c;
      const last = points[points.length - 1];
      const buys = stockDeals.filter((t) => t.side === "purchase").length;
      const sells = stockDeals.filter((t) => t.side === "sale").length;
      document.getElementById("kicker").textContent = (who ? who + " · " : "") + (prices.n || "Ticker");

      if (filerId) {
        const est = theoreticalPnl(stockDeals, points);
        const totalCls = est.total > 0 ? "up" : est.total < 0 ? "down" : "";
        const unCls = est.unrealized > 0 ? "up" : est.unrealized < 0 ? "down" : "";
        const realCls = est.realized > 0 ? "up" : est.realized < 0 ? "down" : "";
        document.getElementById("stats").innerHTML =
          "<div class=\"stat\"><b class=\"" + totalCls + "\">" + signedMoney(est.total) + "</b><span>P&L</span></div>" +
          "<div class=\"stat\"><b class=\"" + unCls + "\">" + signedMoney(est.unrealized) + "</b><span>held</span></div>" +
          "<div class=\"stat\"><b class=\"" + realCls + "\">" + signedMoney(est.realized) + "</b><span>realized</span></div>";
      } else {
        document.getElementById("stats").innerHTML =
          "<div class=\"stat\"><b>" + buys + "</b><span>buys</span></div>" +
          "<div class=\"stat\"><b>" + sells + "</b><span>sells</span></div>" +
          "<div class=\"stat\"><b>" + formatMoney(last[1]) + "</b><span>close</span></div>";
      }

      drawChart(points, chartDeals.map((t) => ({ date: t.trade_date, side: t.side })));
      document.getElementById("marks").innerHTML = deals.map((t) => {
        const px = nearestClose(points, t.trade_date);
        const cls = t.side === "purchase" ? "buy" : "sell";
        const name = filerId
          ? "<span class=\"who\">" + esc(t.owner || "self") + "</span>"
          : "<a class=\"who\" href=\"politician.html?id=" + encodeURIComponent(t.filer_id) + "\">" + esc(t.filer) + "</a>";
        return "<li>" + name +
          "<span class=\"side " + cls + "\">" + (t.side === "purchase" ? "Buy" : t.side === "sale" ? "Sell" : esc(t.side)) + optionTag(t) + "</span>" +
          "<span class=\"when\">" + prettyDate(t.trade_date) + "</span>" +
          "<span class=\"amt\">" + esc(t.amount) + "</span>" +
          "<span class=\"px\">" + (px ? formatMoney(px[1]) + " close" : "no close") + "</span></li>";
      }).join("") || "<li class=\"muted\">No stock trades on this ticker in the last three years.</li>";
    }).catch(() => {
      const note = document.getElementById("note");
      note.hidden = false;
      note.textContent = "Could not load trades.json.";
    });

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
  <script src="refresh.js"></script>
</body>
</html>
