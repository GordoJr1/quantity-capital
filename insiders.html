  <style>
    :root {
      --steel: #1c2430; --panel: #2a3340; --paper: #d8dde3; --white: #eef2f5;
      --caution: #e3b41a; --mute: #8b96a3; --ink: #1a1d26; --teal: #36999d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--ink); color-scheme: dark; scrollbar-gutter: stable; overflow-y: scroll; }
    body {
      font-family: "IBM Plex Sans", sans-serif; color: var(--white);
      background: linear-gradient(180deg, rgba(26, 29, 38, 0.94), rgba(28, 36, 48, 0.97)), url("city.jpg?v=15") 50% 30% / cover fixed;
      min-height: 100vh;
    }
    .wrap { width: min(1680px, calc(100% - 48px)); margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0; border-bottom: 2px solid var(--teal);
    }
    .mark, h1, h2, .kicker, nav, .chip {
      font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
    }
    a.mark { font-weight: 700; letter-spacing: 0.18em; font-size: 1rem; color: inherit; text-decoration: none; }
    .mark span { color: var(--teal); }
    nav { display: flex; gap: 14px; font-size: 0.88rem; letter-spacing: 0.1em; flex-wrap: wrap; }
    nav a { color: var(--paper); text-decoration: none; }
    nav a:hover, nav a.on { color: var(--caution); }
    .kicker { color: var(--caution); margin: 0; font-size: 0.9rem; }
    h1 { font-size: clamp(2.6rem, 8vw, 5.2rem); line-height: 0.88; margin: 4px 0 10px; font-weight: 700; }
    .muted { color: var(--mute); font-size: 0.88rem; line-height: 1.45; }
    .sub-bar {
      padding: 8px 0 2px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .asof {
      color: var(--mute);
      font-size: 0.82rem;
      margin: 0 0 0 auto;
      font-family: "IBM Plex Sans", sans-serif;
    }
    .landed-chip {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.12em; text-transform: uppercase;
      font-size: 0.9rem; color: var(--caution); background: rgba(227, 180, 26, 0.08);
      border: 1px solid var(--caution); padding: 8px 14px; min-height: 44px; text-decoration: none; margin: 0 8px 18px 0;
    }
    .landed-chip:hover { background: rgba(227, 180, 26, 0.16); }
    .subnav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
    .windows { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
    a.chip, .chip {
      background: #151b24; border: 1px solid #4a5563; color: var(--paper);
      padding: 8px 14px; cursor: pointer; font-size: 0.9rem;
      text-decoration: none; display: inline-flex; align-items: center; min-height: 44px;
    }
    .chip.on { border-color: var(--caution); color: var(--caution); background: rgba(227, 180, 26, 0.08); }
    .picker { max-width: 420px; margin: 0 0 16px; }
    .picker input {
      width: 100%; background: #151b24; border: 1px solid #4a5563; color: var(--white);
      padding: 10px 12px; font: inherit; min-height: 44px;
    }
    .picker input:focus { outline: 1px solid var(--caution); }
    .count { color: var(--mute); font-size: 0.85rem; margin: 0 0 6px; }
    footer { border-top: 2px solid var(--caution); margin-top: 20px; }
    footer .wrap {
      display: flex; justify-content: space-between; padding: 18px 0 36px;
      font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute);
    }
    footer a { color: var(--caution); }
    .tabbar { display: none; }
    @media (display-mode: standalone) {
      body { padding-top: env(safe-area-inset-top, 0px); }
    }
    @media (max-width: 820px) {
      .wrap { width: calc(100% - 24px); }
      header nav { display: none; }
      .tabbar {
        display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
        background: var(--ink); border-top: 2px solid var(--teal); padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .tabbar a {
        flex: 1 1 0; min-height: 44px; display: flex; align-items: center; justify-content: center;
        font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
        font-size: 0.78rem; color: var(--paper); text-decoration: none; text-align: center; padding: 0 2px;
      }
      .tabbar a.on, .tabbar a:hover { color: var(--caution); }
      body { padding-bottom: calc(44px + env(safe-area-inset-bottom, 0px) + 8px); }
      h1 { font-size: clamp(1.75rem, 8vw, 2.35rem); }
      .kicker { margin-top: 14px; }
    }

    .qc-txn { display: grid; grid-template-columns: minmax(0, 1fr) max-content; grid-template-areas: "id end" "meta meta"; column-gap: 10px; row-gap: 2px; align-items: center; min-width: 0; width: 100%; max-width: 100%; box-sizing: border-box; overflow: hidden; border-left-width: 4px; border-radius: 10px; }
    .qc-txn-id { grid-area: id; min-width: 0; overflow: hidden; }
    .qc-txn-end { grid-area: end; display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: max-content; }
    .qc-txn-chip { border: 0; border-radius: 999px; background: #5c6570; color: #fff; text-transform: none; letter-spacing: 0; font-family: "IBM Plex Sans", sans-serif; font-weight: 600; padding: 4px 11px; }
    .qc-txn.buy .qc-txn-chip { background: #2f9e4a; color: #fff; }
    .qc-txn.sell .qc-txn-chip { background: #d45a55; color: #fff; }

    .qc-txn.exercise .qc-txn-chip { background: #2a6d72; color: #fff; }
    .qc-txn.postex { border-left-color: #c5726b; }
    .qc-txn-hero, .qc-txn .qc-txn-hero, .qc-txn-hero.is-shares, .qc-txn-hero small { color: #eef2f5; }

    .qc-txn-held.down { color: #ef7a74; }
    .qc-txn-sh, .qc-txn-cols, .qc-txn-id-sub, .qc-txn-tbl, .qc-txn-company { display: none; }
    .qc-txn-id-line { display: flex; align-items: baseline; min-width: 0; max-width: 100%; overflow: hidden; }
    .qc-txn-id-line .qc-txn-role { display: none; }
    .qc-txn-tape { grid-template-columns: minmax(0, 1fr) max-content; grid-template-areas: "id end" "sub sub"; row-gap: 3px; }
    .qc-txn-sub { grid-area: sub; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; min-width: 0; }
    .qc-txn-who { display: flex; flex-wrap: nowrap; align-items: center; min-width: 0; }
    .qc-txn-tape .qc-txn-hero { font-size: 1.32rem; color: #eef2f5; font-weight: 700; }
    .qc-txn-tape .qc-txn-name { font-weight: 600; }
    .qc-txn-co, .qc-txn-tape a.qc-txn-co { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: inherit; text-decoration: none; }
    .qc-txn-tape a.qc-txn-co:hover { color: var(--teal, #36999d); }
    @media (max-width: 560px) {
      .qc-txn-tape .qc-txn-sub { flex-direction: column; align-items: stretch; gap: 2px; }
      .qc-txn-tape .qc-txn-hero { font-size: 1.22rem; }
    }
    @media (min-width: 900px) {
      .qc-txn-list.qc-tape-list > .qc-txn-cols,
      .qc-txn-tape {
        grid-template-columns: 6.7rem minmax(9.2rem, 1.2fr) minmax(9.5rem, 1.7fr) 5.6rem minmax(4.2rem, 0.55fr) minmax(4.4rem, 0.55fr) minmax(4.8rem, 0.7fr) 4.8rem;
        grid-template-areas: "date id co chip sh px hero held";
      }
      .qc-txn-tape {
        column-gap: 10px; row-gap: 0; padding: 5px 12px; border-radius: 0; border-left-width: 3px;
      }
      .qc-txn-tape .qc-txn-end,
      .qc-txn-tape .qc-txn-tbl { display: contents; }
      .qc-txn-tape .qc-txn-sub { display: none; }
      .qc-txn-tape .qc-txn-after { display: none; }
      .qc-txn-tape .qc-txn-chip { grid-area: chip; }
      .qc-txn-tape .qc-txn-date { grid-area: date; }
      .qc-txn-tape .qc-txn-sh { display: block; grid-area: sh; }
      .qc-txn-tape .qc-txn-hero { grid-area: hero; font-size: 0.95rem; }
      .qc-txn-tape .qc-txn-hero.is-shares { display: none; }
      .qc-txn-tape .qc-txn-hero.is-empty { display: block; grid-area: hero; color: var(--mute, #8b96a3); font-weight: 400; font-size: 0.78rem; }
      .qc-txn-tape .qc-txn-px { grid-area: px; }
      .qc-txn-tape .qc-txn-held { grid-area: held; }
      .qc-txn-tape .qc-txn-company,
      .qc-txn-tape a.qc-txn-company { display: flex; align-items: baseline; gap: 0.45em; grid-area: co; min-width: 0; overflow: hidden; text-decoration: none; color: var(--white, #eef2f5); font-size: 0.84rem; font-weight: 600; font-family: "IBM Plex Sans", sans-serif; letter-spacing: 0; text-transform: none; }
      .qc-txn-list.qc-tape-list > .qc-txn-cols .qc-txn-company { display: block; grid-area: co; }
      .qc-txn-tape .qc-txn-company .qc-txn-tk,

      .qc-txn-tape a.qc-txn-company:hover .qc-txn-tk,

      .qc-txn-tape .qc-txn-id-sub .qc-txn-dot { display: inline; }

  <script src="qc.js?v=98"></script>
  <script>
    const WINDOWS = [14, 30, 90, 540];
    const params = new URLSearchParams(location.search);
    let days = WINDOWS.indexOf(Number(params.get("w"))) >= 0 ? Number(params.get("w")) : 90;
    let side = params.get("side") || "";
    let q = "";

    function labelW(d) {
      if (d <= 14) return "14 days";
      if (d <= 30) return "30 days";
      if (d <= 90) return "90 days";
      return "18 months";
    }
    function newestFirst(a, b) {
      const traded = String(b.trade_date || "").localeCompare(String(a.trade_date || ""));
      if (traded) return traded;
      const filed = String(b.filed_date || "").localeCompare(String(a.filed_date || ""));
      if (filed) return filed;
      const added = String(b.added || "").localeCompare(String(a.added || ""));
      if (added) return added;
      return String(b.id || "").localeCompare(String(a.id || ""));
    }
    function paint(rows, collected) {
      document.getElementById("asof").textContent = QC.asOfLabel(collected);
      document.getElementById("windows").innerHTML =
        WINDOWS.map((d) => "<button type=\"button\" class=\"chip" + (d === days ? " on" : "") + "\" data-w=\"" + d + "\">" + labelW(d) + "</button>").join("") +
        "<button type=\"button\" class=\"chip" + (side === "purchase" ? " on" : "") + "\" data-side=\"purchase\">Buys</button>" +
        "<button type=\"button\" class=\"chip" + (side === "sale" ? " on" : "") + "\" data-side=\"sale\">Sells</button>";
      const cut = new Date(); cut.setDate(cut.getDate() - days);
      const cutIso = cut.toISOString().slice(0, 10);
      const needle = q.trim().toLowerCase();
      const vis = rows.filter((t) => {
        const day = t.filed_date || t.trade_date || "";
        if (day && day < cutIso) return false;
        if (side === "purchase" && !QC.isMarketBuy(t)) return false;
        if (side === "sale" && !QC.isMarketSale(t)) return false;
        if (needle) {
          const blob = [t.filer, t.title, t.ticker, t.company].join(" ").toLowerCase();
          if (!blob.includes(needle)) return false;
        }
        return true;
      }).sort(newestFirst);
      document.getElementById("count").textContent = vis.length + " trades in view";
      const tradeHtml = vis.slice(0, 400).map((t) =>
        QC.tradeRowHtml(t, {
          variant: "tape",
          nameHref: t.filer_id ? "insider.html?id=" + encodeURIComponent(t.filer_id) : ""
        })
      ).join("");
      document.getElementById("rows").innerHTML = tradeHtml
        ? QC.tradeColsHtml({ nameLabel: "Name", tape: true }) + tradeHtml
        : "<li class=\"muted\">No insider prints in this window.</li>";
    }

    let all = [];
    let collected = "";
    async function run() {
      const data = await fetch("insider-trades-lite.json").then((r) => r.json());
      all = data.trades || [];
      collected = data.collected || "";
      paint(all, collected);
    }
    document.getElementById("windows").addEventListener("click", (e) => {
      const w = e.target.closest("button[data-w]");
      const s = e.target.closest("button[data-side]");
      if (w) days = Number(w.dataset.w);
      if (s) side = side === s.dataset.side ? "" : s.dataset.side;
      const p = new URLSearchParams();
      p.set("w", String(days));
      if (side) p.set("side", side);
      history.replaceState(null, "", location.pathname + "?" + p.toString());
      paint(all, collected);
    });
    document.getElementById("q").addEventListener("input", (e) => {
      q = e.target.value;
      paint(all, collected);
    });
    run().catch(() => {
      document.getElementById("rows").innerHTML = "<li class=\"muted\">Could not load insider tape.</li>";
    });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
  </script>
